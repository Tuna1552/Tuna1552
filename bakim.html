<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hala Çalışıyoruz.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #fff;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.6s ease-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center justify-center min-h-screen p-8 text-center">
    <div class="bg-gray-800 rounded-2xl shadow-xl p-10 max-w-lg w-full transform -translate-y-4 animate-fade-in-up">
        <!-- Modern heart SVG icon -->
        <svg class="w-24 h-24 text-pink-500 mx-auto mb-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
        </svg>
        <h1 class="text-3xl sm:text-4xl font-bold text-pink-500 mb-4">Hala Çalışıyoruz.</h1>
        <p class="text-lg text-gray-300 mb-6">Ece, bu sayfa şu anda sana özel bir sürpriz için güncelleniyor. Çok yakında hazır olacak!</p>
        <p class="text-gray-400">Lütfen biraz daha bekle...</p>
    </div>
</body>
</html>
