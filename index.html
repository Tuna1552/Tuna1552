<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>🎉 Ece'nin Doğum Günü 🎉</title>
  <style>
    body {
      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #4a148c;
    }
    header {
      margin: 40px 0 20px 0;
      font-size: 2.8rem;
      font-weight: 700;
      text-align: center;
      text-shadow: 1px 1px 4px #9c27b0cc;
    }
    #startMusicBtn {
      background: #ab47bc;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 12px #9c27b0aa;
      transition: background 0.3s ease;
      margin-bottom: 40px;
    }
    #startMusicBtn:hover {
      background: #8e24aa;
    }
    #quizContainer {
      max-width: 450px;
      background: white;
      box-shadow: 0 10px 30px #ce93d8aa;
      border-radius: 16px;
      padding: 30px 40px;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    #quizButton {
      background: linear-gradient(45deg, #ff4081, #f50057);
      color: white;
      font-weight: 800;
      font-size: 1.6rem;
      padding: 18px 50px;
      border-radius: 60px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px #f50057cc;
      transition: box-shadow 0.3s ease, transform 0.2s ease;
      margin-bottom: 20px;
      user-select: none;
    }
    #quizButton:hover {
      box-shadow: 0 12px 30px #f50057ee;
      transform: scale(1.05);
    }
    #questionText {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 25px;
      text-align: center;
      min-height: 60px;
      color: #6a1b9a;
    }
    .options {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .optionBtn {
      background: #f3e5f5;
      border: 2px solid #ba68c8;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      color: #4a148c;
      user-select: none;
      transition: background-color 0.3s ease, border-color 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .optionBtn:hover {
      background: #ce93d8;
      border-color: #9c27b0;
      color: white;
    }
    .optionBtn.correct {
      background: #a5d6a7;
      border-color: #388e3c;
      color: #1b5e20;
      font-weight: 700;
    }
    .optionBtn.incorrect {
      background: #ef9a9a;
      border-color: #c62828;
      color: #b71c1c;
      font-weight: 700;
    }
    #textAnswerContainer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #textAnswerInput {
      font-size: 1.1rem;
      padding: 12px 18px;
      width: 100%;
      border-radius: 12px;
      border: 2px solid #ba68c8;
      outline: none;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
      color: #4a148c;
    }
    #textAnswerInput:focus {
      border-color: #9c27b0;
      box-shadow: 0 0 8px #ce93d8cc;
    }
    #submitTextAnswerBtn {
      margin-top: 18px;
      background: #ab47bc;
      color: white;
      border: none;
      padding: 12px 35px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px #9c27b0aa;
      transition: background 0.3s ease;
      user-select: none;
    }
    #submitTextAnswerBtn:hover {
      background: #8e24aa;
    }
    #feedbackIcon {
      font-size: 1.5rem;
      margin-left: 15px;
      user-select: none;
    }
    #nextQuestionBtn {
      margin-top: 25px;
      background: #6a1b9a;
      color: white;
      border: none;
      padding: 14px 50px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 5px 15px #4a148caa;
      user-select: none;
      display: none;
      transition: background 0.3s ease;
    }
    #nextQuestionBtn:hover {
      background: #4a148c;
    }
    #resultContainer {
      margin-top: 30px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #4a148c;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>🎉 Ece'nin Doğum Günü 🎉</header>

  <button id="startMusicBtn">Müziği Çal</button>

  <audio id="music" src="https://cdn.pixabay.com/download/audio/2022/03/21/audio_19e3c657cc.mp3?filename=happy-birthday-111232.mp3" preload="auto"></audio>

  <button id="quizButton">Ece'nin Doğum Günü Quizi</button>

  <div id="quizContainer" role="region" aria-live="polite" aria-label="Ece'nin Doğum Günü Quizi">
    <div id="questionText"></div>

    <div class="options"></div>

    <div id="textAnswerContainer" style="display:none;">
      <input type="text" id="textAnswerInput" aria-label="Cevabınızı yazınız" autocomplete="off" />
      <button id="submitTextAnswerBtn">Gönder</button>
      <span id="feedbackIcon" aria-live="polite" role="img"></span>
    </div>

    <button id="nextQuestionBtn">Sonraki Soru</button>

    <div id="resultContainer"></div>
  </div>

<script>
  const startMusicBtn = document.getElementById('startMusicBtn');
  const music = document.getElementById('music');
  const quizButton = document.getElementById('quizButton');
  const quizContainer = document.getElementById('quizContainer');
  const questionText = document.getElementById('questionText');
  const optionsDiv = document.querySelector('.options');
  const textAnswerContainer = document.getElementById('textAnswerContainer');
  const textAnswerInput = document.getElementById('textAnswerInput');
  const submitTextAnswerBtn = document.getElementById('submitTextAnswerBtn');
  const feedbackIcon = document.getElementById('feedbackIcon');
  const nextQuestionBtn = document.getElementById('nextQuestionBtn');
  const resultContainer = document.getElementById('resultContainer');

  // Müzik çal ve butonu gizle
  startMusicBtn.addEventListener('click', () => {
    music.play().then(() => {
      startMusicBtn.style.display = 'none';
    }).catch(() => {
      alert('Tarayıcı müzik çalma izni gerekebilir.');
    });
  });

  // Quiz soruları ve cevapları (şıklar A-D veya text)
  // Her soru nesnesi:
  // text: soru metni
  // type: 'multiple' veya 'text'
  // options: sadece 'multiple' için, şıklar dizisi [{label:'A', text:'11-İ'}...]
  // answer: doğru cevap (küçük harf duyarsız karşılaştırma için text için string, multiple için label)

  const quizQuestions = [
    {
      text: 'Ece şuanda hangi okulda okuyor?',
      type: 'multiple',
      options: [
        {label: 'A', text: 'Atatürk Anadolu Lisesi'},
        {label: 'B', text: 'Fen Lisesi'},
        {label: 'C', text: 'Anadolu Lisesi'},
        {label: 'D', text: 'İmam Hatip Lisesi'}
      ],
      answer: 'A'
    },
    {
      text: 'Karatede şu anda hangi kuşak?',
      type: 'multiple',
      options: [
        {label: 'A', text: 'Beyaz'},
        {label: 'B', text: 'Kahverengi'},
        {label: 'C', text: 'Siyah'},
        {label: 'D', text: 'Mavi'}
      ],
      answer: 'B'
    },
    {
      text: 'Doğum yılı kaçtır?',
      type: 'multiple',
      options: [
        {label: 'A', text: '2006'},
        {label: 'B', text: '2007'},
        {label: 'C', text: '2008'},
        {label: 'D', text: '2009'}
      ],
      answer: 'C'
    },
    {
      text: 'Doğum günü ayın kaçındadır?',
      type: 'multiple',
      options: [
        {label: 'A', text: '15'},
        {label: 'B', text: '29'},
        {label: 'C', text: '1'},
        {label: 'D', text: '10'}
      ],
      answer: 'B'
    },
    {
      text: 'En sevdiği renk nedir?',
      type: 'multiple',
      options: [
        {label: 'A', text: 'Mavi'},
        {label: 'B', text: 'Kırmızı'},
        {label: 'C', text: 'Pembe'},
        {label: 'D', text: 'Yeşil'}
      ],
      answer: 'C'
    },
    {
      text: 'Kaçıncı sınıf?',
      type: 'multiple',
      options: [
        {label: 'A', text: '9'},
        {label: 'B', text: '10'},
        {label: 'C', text: '11'},
        {label: 'D', text: '12'}
      ],
      answer: 'C'
    },
    {
      text: 'Hangi şube?',
      type: 'multiple',
      options: [
        {label: 'A', text: '11-İ'},
        {label: 'B', text: '11-H'},
        {label: 'C', text: '11-G'},
        {label: 'D', text: '11-N'}
      ],
      answer: 'A'
    },
    {
      text: 'Okul numarası kaçtır?',
      type: 'multiple',
      options: [
        {label: 'A', text: '1023'},
        {label: 'B', text: '1024'},
        {label: 'C', text: '1025'},
        {label: 'D', text: '1026'}
      ],
      answer: 'C'
    },
    {
      text: 'En sevdiği hayvan nedir?',
      type: 'multiple',
      options: [
        {label: 'A', text: 'Köpek'},
        {label: 'B', text: 'Kedi'},
        {label: 'C', text: 'Kuş'},
        {label: 'D', text: 'At'}
      ],
      answer: 'B'
    },
    {
      text: 'Ece\'nin en sevdiği arkadaşı kimdir?',
      type: 'text',
      answer: 'tuna'
    }
  ];

  let currentQuestionIndex = 0;
  let score = 0;
  let answered = false;

  function clearOptions() {
    optionsDiv.innerHTML = '';
    feedbackIcon.textContent = '';
    textAnswerInput.value = '';
  }

  function showQuestion() {
    answered = false;
    feedbackIcon.textContent = '';
    nextQuestionBtn.style.display = 'none';
    resultContainer.textContent = '';

    const q = quizQuestions[currentQuestionIndex];
    questionText.textContent = q.text;

    if (q.type === 'multiple') {
      textAnswerContainer.style.display = 'none';
      optionsDiv.style.display = 'flex';
      clearOptions();

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.classList.add('optionBtn');
        btn.textContent = `${opt.label}) ${opt.text}`;
        btn.setAttribute('data-label', opt.label);
        btn.setAttribute('type', 'button');
        btn.addEventListener('click', () => {
          if (answered) return;
          answered = true;
          if (opt.label === q.answer) {
            btn.classList.add('correct');
            score++;
          } else {
            btn.classList.add('incorrect');
            // Doğru cevabı göster
            const correctBtn = [...optionsDiv.children].find(b => b.getAttribute('data-label') === q.answer);
            if (correctBtn) correctBtn.classList.add('correct');
          }
          nextQuestionBtn.style.display = 'inline-block';
        });
        optionsDiv.appendChild(btn);
      });
    } else if (q.type === 'text') {
      optionsDiv.style.display = 'none';
      clearOptions();
      textAnswerContainer.style.display = 'flex';
      textAnswerInput.focus();
      submitTextAnswerBtn.disabled = false;
      feedbackIcon.textContent = '';
    }
  }

  submitTextAnswerBtn.addEventListener('click', () => {
    if (answered) return;
    const userAnswer = textAnswerInput.value.trim().toLowerCase();
    if (!userAnswer) return;
    answered = true;

    const correctAnswer = quizQuestions[currentQuestionIndex].answer.toLowerCase();

    if (userAnswer === correctAnswer) {
      score++;
      feedbackIcon.textContent = '✔️';
      feedbackIcon.style.color = 'green';
    } else {
      feedbackIcon.textContent = '❌';
      feedbackIcon.style.color = 'red';
    }
    submitTextAnswerBtn.disabled = true;
    nextQuestionBtn.style.display = 'inline-block';
  });

  nextQuestionBtn.addEventListener('click', () => {
    currentQuestionIndex++;
    if (currentQuestionIndex >= quizQuestions.length) {
      showResult();
    } else {
      showQuestion();
    }
  });

  function showResult() {
    quizContainer.innerHTML = `
      <div style="font-size:1.6rem; font-weight:700; color:#6a1b9a; margin-bottom:20px;">
        🎉 Quiz Tamamlandı! 🎉
      </div>
      <div>
        Doğru cevap sayınız: <strong>${score} / ${quizQuestions.length}</strong>
      </div>
      <button id="restartQuizBtn" style="
        margin-top: 30px;
        background: #ab47bc;
        color: white;
        border: none;
        padding: 14px 50px;
        border-radius: 60px;
        font-weight: 700;
        font-size: 1.2rem;
        cursor: pointer;
        box-shadow: 0 4px 12px #9c27b0aa;
        user-select: none;
      ">Quizi Tekrarla</button>
    `;

    const restartBtn = document.getElementById('restartQuizBtn');
    restartBtn.addEventListener('click', () => {
      currentQuestionIndex = 0;
      score = 0;
      quizContainer.innerHTML = `
        <div id="questionText"></div>
        <div class="options"></div>
        <div id="textAnswerContainer" style="display:none;">
          <input type="text" id="textAnswerInput" aria-label="Cevabınızı yazınız" autocomplete="off" />
          <button id="submitTextAnswerBtn">Gönder</button>
          <span id="feedbackIcon" aria-live="polite" role="img"></span>
        </div>
        <button id="nextQuestionBtn">Sonraki Soru</button>
        <div id="resultContainer"></div>
      `;

      // Yeniden elemanları seç ve eventleri ekle
      questionText = document.getElementById('questionText');
      optionsDiv = document.querySelector('.options');
      textAnswerContainer = document.getElementById('textAnswerContainer');
      textAnswerInput = document.getElementById('textAnswerInput');
      submitTextAnswerBtn = document.getElementById('submitTextAnswerBtn');
      feedbackIcon = document.getElementById('feedbackIcon');
      nextQuestionBtn = document.getElementById('nextQuestionBtn');
      resultContainer = document.getElementById('resultContainer');

      submitTextAnswerBtn.addEventListener('click', () => {
        if (answered) return;
        const userAnswer = textAnswerInput.value.trim().toLowerCase();
        if (!userAnswer) return;
        answered = true;

        const correctAnswer = quizQuestions[currentQuestionIndex].answer.toLowerCase();

        if (userAnswer === correctAnswer) {
          score++;
          feedbackIcon.textContent = '✔️';
          feedbackIcon.style.color = 'green';
        } else {
          feedbackIcon.textContent = '❌';
          feedbackIcon.style.color = 'red';
        }
        submitTextAnswerBtn.disabled = true;
        nextQuestionBtn.style.display = 'inline-block';
      });

      nextQuestionBtn.addEventListener('click', () =>  currentQuestionIndex++;
   if (currentQuestionIndex >= quizQuestions.length) {
          showResult();
        } else {
          showQuestion();
        }
      });

      showQuestion();
    });
  }

  quizButton.addEventListener('click', () => {
    quizButton.style.display = 'none';
    quizContainer.style.display = 'flex';
    currentQuestionIndex = 0;
    score = 0;
    showQuestion();
  });

</script>
</body>
</html>
