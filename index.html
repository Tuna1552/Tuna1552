<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>29 Mayıs 2026 - Sürpriz</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body, html {
      height: 100%;
      background: linear-gradient(135deg, #ffe6f0, #e0f7ff);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #password-screen {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .password-box {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .password-box h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .password-box input {
      padding: 12px 16px;
      width: 200px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .password-box button {
      padding: 12px 24px;
      background-color: #ff66a3;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      transition: background-color 0.3s;
    }

    .password-box button:hover {
      background-color: #ff3385;
    }

    #main-content {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #333;
    }

    .countdown {
      font-size: 2.5em;
      font-weight: 600;
      color: #cc0066;
      margin-top: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0,0,0,0.1);
      animation: popIn 1s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }

    @keyframes popIn {
      from {opacity: 0; transform: scale(0.5);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>

  <!-- Şifre Giriş Ekranı -->
  <div id="password-screen">
    <div class="password-box">
      <h2>Şifreyi Gir</h2>
      <input type="password" id="passwordInput" placeholder="Şifre">
      <br>
      <button onclick="checkPassword()">Giriş</button>
    </div>
  </div>

  <!-- Ana Sayfa İçeriği -->
  <div id="main-content">
    <h1>29 Mayıs 2026'ya Kalan Süre</h1>
    <div class="countdown" id="countdown"></div>
  </div>

  <script>
    const passwordScreen = document.getElementById('password-screen');
    const mainContent = document.getElementById('main-content');

    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      if (input === "2008") {
        passwordScreen.style.display = 'none';
        mainContent.style.display = 'flex';
      } else {
        alert("Hatalı şifre! Lütfen tekrar deneyin.");
      }
    }

    // Geri Sayım
    const countdown = document.getElementById("countdown");
    const targetDate = new Date("May 29, 2026 00:00:00").getTime();

    setInterval(function() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdown.innerHTML = `${days} gün ${hours} saat ${minutes} dakika ${seconds} saniye`;
    }, 1000);
  </script>
</body>
</html>
