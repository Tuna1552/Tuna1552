<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎉 Ece'nin Doğum Günü 🎉</title>
  <style>
    body {
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      color: #333;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 50px 20px 80px;
      margin: 0;
      overflow-x: hidden;
      overflow-y: hidden;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
      user-select: none;
    }
    #countdown {
      font-size: 2em;
      margin-top: 1em;
      color: #ff007f;
      padding: 10px 0;
      user-select: none;
    }
    #message {
      font-size: 2em;
      margin-top: 2em;
      color: #ff1493;
      display: none;
      user-select: none;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 999;
    }
    /* BALONLAR */
    .balloon {
      position: fixed;
      bottom: 20px;
      width: 60px;
      height: 80px;
      background-color: #ff69b4;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      cursor: default;
      color: white;
      font-weight: bold;
      font-size: 28px;
      line-height: 80px;
      text-align: center;
      user-select: none;
      z-index: 20;
      transition: transform 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .balloon:hover {
      transform: scale(1.1);
    }
    /* Kalpler */
    .heart {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: #ff0066;
      clip-path: polygon(
        50% 15%, 61% 17%, 70% 25%, 75% 35%, 75% 50%, 
        70% 60%, 60% 70%, 50% 80%, 40% 70%, 30% 60%, 
        25% 50%, 25% 35%, 30% 25%, 39% 17%
      );
      animation: heartbeat 1.5s infinite;
      user-select: none;
      z-index: 20;
    }
    .heart:nth-child(1) {
      right: 20px;
      bottom: 100px;
      width: 60px;
      height: 60px;
      animation-delay: 0s;
    }
    .heart:nth-child(2) {
      right: 90px;
      bottom: 130px;
      width: 45px;
      height: 45px;
      background: #ff4081;
      animation-delay: 0.7s;
    }
    .heart:nth-child(3) {
      right: 55px;
      bottom: 60px;
      width: 50px;
      height: 50px;
      background: #ff1a75;
      animation-delay: 1.4s;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* Responsive mobil uyumluluk */
    @media (max-width: 600px) {
      body {
        padding: 20px 10px 70px;
      }
      h1 {
        font-size: 2em;
      }
      #countdown {
        font-size: 1.5em;
        padding: 10px 0;
      }
      #message {
        font-size: 1.5em;
      }
      .balloon {
        width: 40px;
        height: 55px;
        font-size: 24px;
        bottom: 10px !important;
      }
      .heart {
        width: 40px !important;
        height: 40px !important;
      }
      .heart:nth-child(1) {
        right: 10px !important;
        bottom: 70px !important;
      }
      .heart:nth-child(2) {
        right: 70px !important;
        bottom: 100px !important;
      }
      .heart:nth-child(3) {
        right: 40px !important;
        bottom: 40px !important;
      }
    }
  </style>
</head>
<body>

  <h1>🎈 Ece'nin Doğum Gününe Geri Sayım 🎈</h1>
  <div id="countdown">Yükleniyor...</div>
  <div id="message">🎉 Doğum günün kutlu olsun Ece! Nice yıllara! 🎂💖</div>

  <!-- Müzik -->
  <audio id="music" preload="auto" loop>
    <source src="https://dl.sndup.net/tsc3/UntilIFoundYou.mp3" type="audio/mpeg" />
    Tarayıcınız ses çaları desteklemiyor.
  </audio>

  <!-- Konfeti için canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Kalpler -->
  <div class="heart"></div>
  <div class="heart"></div>
  <div class="heart"></div>

  <!-- Balonlar -->
  <div class="balloon" style="left: 10%;">🎈</div>
  <div class="balloon" style="left: 30%;">🎈</div>
  <div class="balloon" style="left: 50%;">🎈</div>
  <div class="balloon" style="left: 70%;">🎈</div>
  <div class="balloon" style="left: 90%;">🎈</div>

  <script>
    const countdownElement = document.getElementById('countdown');
    const messageElement = document.getElementById('message');
    const music = document.getElementById('music');
    const balloons = document.querySelectorAll('.balloon');

    // 29 Mayıs 00:00 hedefi (bu yıl veya gelecek yıl)
    const hedefTarih = new Date();
    const now = new Date();
    if (now.getMonth() > 4 || (now.getMonth() === 4 && now.getDate() >= 29)) {
      hedefTarih.setFullYear(now.getFullYear() + 1);
    } else {
      hedefTarih.setFullYear(now.getFullYear());
    }
    hedefTarih.setMonth(4); // Mayıs (0 tabanlı)
    hedefTarih.setDate(29);
    hedefTarih.setHours(0, 0, 0, 0);

    function updateCountdown() {
      const now = new Date();
      const diff = hedefTarih - now;

      if (diff <= 0) {
        countdownElement.style.display = "none";
        messageElement.style.display = "block";
        startConfetti();
        playMusic();
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      countdownElement.innerHTML =
        `📅 ${days} gün, 🕒 ${hours} saat, ⏰ ${minutes} dakika, ⏳ ${seconds} saniye`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Balonların yavaş yukarı çıkışı
    balloons.forEach((balloon) => {
      let bottomPos = 20; // başlangıç bottom px
      function rise() {
        bottomPos += 0.3; // yavaş yükselme
        if (bottomPos > window.innerHeight + 80) {
          bottomPos = -80; // tekrar başa dön
        }
        balloon.style.bottom = bottomPos + 'px';
        requestAnimationFrame(rise);
      }
      rise();
    });

    // Konfeti efekti
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      let W = window.innerWidth;
      let H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;

      const particles = [];
      const particleCount = 150;
      const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd'];

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H - H,
          r: Math.random() * 6 + 4,
          d: Math.random() * particleCount,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngle: 0,
          tiltAngleIncremental: (Math.random() * 0.07) + .05
        });
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach((p) => {
          ctx.beginPath();
          ctx.lineWidth = p.r;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
          ctx.stroke();
        });
        update();
      }

      function update() {
        particles.forEach((p) => {
          p.y += Math.cos(p.d) + 1 + p.r / 2;
          p.tiltAngle += p.tiltAngleIncremental;
          p.tilt = Math.sin(p.tiltAngle) * 15;

          if (p.y > H) {
            p.y = -10;
            p.x = Math.random() * W;
          }
        });
      }

      function loop() {
        draw();
        requestAnimationFrame(loop);
      }

      loop();
    }

    // Müzik oynatma fonksiyonu
    function playMusic() {
      music.play().catch(() => {});
    }

    // Kullanıcı tıklayınca müzik başlasın (mobil uyumluluk için)
    document.body.addEventListener("click", () => {
      playMusic();
    }, { once: true });

  </script>

</body
