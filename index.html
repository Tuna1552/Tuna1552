<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>29 Mayıs 2026 - Sürpriz</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: linear-gradient(135deg, #ffe6f0, #e0f7ff);
      color: #333;
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: #fff0f6;
      padding: 12px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      z-index: 1000;
    }

    .navbar a {
      margin: 0 15px;
      color: #cc0066;
      text-decoration: none;
      font-weight: bold;
      font-size: 1em;
      transition: color 0.3s;
    }

    .navbar a:hover {
      color: #ff3399;
    }

    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 60px;
    }

    #password-screen {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
      animation: fadeIn 1s ease-in-out;
    }

    .password-box {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      text-align: center;
      animation: popIn 1s ease-in-out;
      max-width: 90%;
      width: 400px;
    }

    .password-box h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 1.5em;
    }

    .password-box input {
      padding: 12px 16px;
      width: 100%;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
      transition: all 0.3s;
    }

    .password-box input:focus {
      outline: none;
      border-color: #ff66a3;
      box-shadow: 0 0 5px #ff99c2;
    }

    .password-box button {
      padding: 12px 24px;
      background-color: #ff66a3;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      transition: background-color 0.3s, transform 0.2s;
    }

    .password-box button:hover {
      background-color: #ff3385;
      transform: scale(1.05);
    }

    .error {
      color: red;
      margin-top: 10px;
      font-size: 0.9em;
    }

    .countdown {
      font-size: 2em;
      font-weight: 600;
      color: #cc0066;
      margin-top: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0,0,0,0.1);
      animation: popIn 1s ease;
      max-width: 90%;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: 40px auto;
      width: 100%;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes popIn {
      from {opacity: 0; transform: scale(0.5);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>

  <!-- Şifre Giriş Ekranı -->
  <div id="password-screen">
    <div class="password-box">
      <h2>Şifreyi Gir</h2>
      <input type="password" id="passwordInput" placeholder="Şifre" onkeydown="handleKey(event)">
      <br>
      <button onclick="checkPassword()">Giriş</button>
      <div class="error" id="errorText"></div>
    </div>
  </div>

  <!-- Navigasyon Menüsü -->
  <header class="navbar">
    <nav>
      <a href="#home">🏠 Anasayfa</a>
      <a href="#countdown">⏳ Geri Sayım</a>
      <a href="#gallery">📸 Galeri</a>
    </nav>
  </header>

  <!-- Anasayfa Bölümü -->
  <section id="home">
    <h1>29 Mayıs 2026 Sürprizine Hoş Geldin!</h1>
    <p>Senin için hazırladığım özel bir şey var 💖</p>
  </section>

  <!-- Geri Sayım Bölümü -->
  <section id="countdown">
    <h2>29 Mayıs 2026'ya Kalan Süre</h2>
    <div class="countdown" id="countdownBox"></div>
  </section>

  <!-- Galeri Bölümü -->
  <section id="gallery">
    <h2>Fotoğraf Galerisi</h2>
    <div class="gallery">
      <img src="https://i.imgur.com/w38ApFX.jpeg" alt="Fotoğraf 1">
      <img src="https://i.imgur.com/ahJTXWO.jpeg" alt="Fotoğraf 2">
      <img src="https://i.imgur.com/8MvwSQp.jpeg" alt="Fotoğraf 3">
      <img src="https://i.imgur.com/x39dCoM.jpeg" alt="Fotoğraf 4">
      <img src="https://i.imgur.com/DUhcnSQ.jpeg" alt="Fotoğraf 5">
      <img src="https://i.imgur.com/lcQuFtH.jpeg" alt="Fotoğraf 6">
    </div>
  </section>

  <script>
    const passwordScreen = document.getElementById('password-screen');
    const mainElements = document.querySelectorAll('section, .navbar');
    const errorText = document.getElementById('errorText');

    // Başta içeriği gizle
    mainElements.forEach(el => el.style.display = 'none');

    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      if (input === "2008") {
        passwordScreen.style.display = 'none';
        mainElements.forEach(el => el.style.display = 'block');
        errorText.innerText = "";
      } else {
        errorText.innerText = "Hatalı şifre! Lütfen tekrar deneyin.";
      }
    }

    function handleKey(e) {
      if (e.key === "Enter") {
        checkPassword();
      }
    }

    // Geri Sayım
    const countdown = document.getElementById("countdownBox");
    const targetDate = new Date("May 29, 2026 00:00:00").getTime();

    setInterval(function() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdown.innerHTML = `${days} gün ${hours} saat ${minutes} dakika ${seconds} saniye`;
    }, 1000);
  </script>
</body>
</html>
