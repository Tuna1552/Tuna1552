<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>29 Mayıs 2026 - Geri Sayım</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2&display=swap');

  /* Temel stil */
  body, html {
    margin:0; padding:0; height:100%;
    background: linear-gradient(135deg, #ffcee8, #ffd1d1);
    font-family: 'Baloo 2', cursive;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #800040;
    user-select: none;
  }

  h1 {
    font-size: 2.8rem;
    margin-bottom: 0.2em;
    text-shadow: 1px 1px 4px #ff9fc9;
  }
  p {
    font-size: 1.2rem;
    margin-top: 0;
    margin-bottom: 2em;
    font-weight: 600;
    text-shadow: 0 0 5px #ffbad9;
  }

  #countdown {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    background: rgba(255,255,255,0.8);
    padding: 0.8em 1.2em;
    border-radius: 25px;
    box-shadow: 0 4px 12px rgba(255,105,180,0.5);
    min-width: 320px;
    text-align: center;
  }

  /* Kalp animasyonları */
  .heart {
    position: fixed;
    bottom: -50px;
    width: 20px;
    height: 20px;
    background: #ff69b4;
    transform: rotate(-45deg);
    animation: rise 6s linear infinite;
    opacity: 0.8;
    pointer-events: none;
  }
  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff69b4;
    border-radius: 50%;
  }
  .heart::before {
    top: 0;
    left: 10px;
  }
  .heart::after {
    top: 10px;
    left: 0;
  }

  @keyframes rise {
    0% {
      bottom: -50px;
      opacity: 0.8;
      transform: translateX(0) rotate(-45deg) scale(1);
    }
    100% {
      bottom: 110vh;
      opacity: 0;
      transform: translateX(40px) rotate(-45deg) scale(1.5);
    }
  }
</style>
</head>
<body>

<h1>29 Mayıs 2026'ya Kalan Süre</h1>
<div id="countdown">Yükleniyor...</div>

<script>
  // Geri sayım fonksiyonu
  const countdownEl = document.getElementById('countdown');
  const targetDate = new Date('May 29, 2026 00:00:00').getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance < 0) {
      countdownEl.textContent = "Doğum Günün Kutlu Olsun! 🎉🎂";
      clearInterval(interval);
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    countdownEl.textContent = `${days} gün ${hours} saat ${minutes} dakika ${seconds} saniye`;
  }
  updateCountdown();
  const interval = setInterval(updateCountdown, 1000);

  // Kalp oluşturma
  function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (4 + Math.random() * 3) + 's';
    heart.style.opacity = Math.random() * 0.5 + 0.5;
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }
  // Her 300ms'de bir kalp oluştur
  setInterval(createHeart, 300);
</script>

</body>
</html>
