<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>🎉 Ece'nin Doğum Günü 🎉</title>
  <style>
    body {
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      color: #333;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 50px;
      overflow: hidden;
      position: relative;
      height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
      position: relative;
      z-index: 1000;
      user-select: none;
    }
    #countdown {
      position: relative;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 15px 30px;
      display: inline-block;
      font-weight: 700;
      font-size: 2em;
      color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
      user-select: none;
    }
    #message {
      font-size: 2em;
      margin-top: 2em;
      color: #ff1493;
      display: none;
      position: relative;
      z-index: 1000;
      user-select: none;
    }

    /* BALONLAR */
    .balloon {
      position: absolute;
      width: 60px;
      height: 80px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
      user-select: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-weight: bold;
      font-size: 22px;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      z-index: 900; /* countdown üstünde, kalpler altında */
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(circle at 50% 40%, #ff6f91, #d32f6f);
    }
    .balloon span {
      margin-bottom: 10px;
      display: none;
      user-select: none;
      pointer-events: none;
    }
    .balloon.clicked span {
      display: block;
    }
    .balloon:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 8px #ff6f91);
    }
    .balloon::after {
      content: "";
      position: absolute;
      bottom: -15px;
      left: 50%;
      width: 2px;
      height: 25px;
      background: #444;
      transform: translateX(-50%);
      border-radius: 1px;
    }

    @keyframes floatBalloon {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-150px); opacity: 1; }
    }

    /* Kalpler */
    .heart {
      position: fixed;
      width: 30px;
      height: 30px;
      background-color: #ff1493;
      transform: rotate(-45deg);
      pointer-events: none;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
      filter: drop-shadow(0 0 3px #ff69b4);
      z-index: 800;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: #ff1493;
      border-radius: 50%;
    }
    .heart::before {
      top: -15px;
      left: 0;
    }
    .heart::after {
      left: 15px;
      top: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(-45deg); opacity: 0.8; }
      100% { transform: translateY(-400px) rotate(-45deg); opacity: 0; }
    }

    /* Canvas konfeti z-index */
    canvas#confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 950; /* balonların altında */
    }
  </style>
</head>
<body>
  <h1>🎈 Ece'nin Doğum Gününe Geri Sayım 🎈</h1>
  <div id="countdown">Yükleniyor...</div>
  <div id="message">🎉 Doğum günün kutlu olsun Ece! Nice yıllara! 🎂💖</div>

  <!-- Müzik -->
  <audio id="music" preload="auto">
    <source src="https://dl.sndup.net/tsc3/UntilIFoundYou.mp3" type="audio/mpeg" />
    Tarayıcınız ses çaları desteklemiyor.
  </audio>

  <!-- Konfeti için canvas -->
  <canvas id="confetti-canvas"></canvas>

  <script>
    const countdownElement = document.getElementById('countdown');
    const messageElement = document.getElementById('message');
    const music = document.getElementById('music');

    // 29 Mayıs 00:00 hedef tarihi ayarla
    const hedefTarih = new Date();
    // Eğer bugün 29 Mayıs veya sonrası ise gelecek yıl
    if (hedefTarih.getMonth() > 4 || (hedefTarih.getMonth() === 4 && hedefTarih.getDate() > 29)) {
      hedefTarih.setFullYear(hedefTarih.getFullYear() + 1);
    }
    hedefTarih.setMonth(4); // Mayıs (0 bazlı)
    hedefTarih.setDate(29);
    hedefTarih.setHours(0, 0, 0, 0);

    // Geri sayım fonksiyonu
    function updateCountdown() {
      const now = new Date();
      const fark = hedefTarih - now;

      if (fark <= 0) {
        countdownElement.style.display = "none";
        messageElement.style.display = "block";
        startConfetti();
        music.play().catch(() => {});
        return;
      }

      const gun = Math.floor(fark / (1000 * 60 * 60 * 24));
      const saat = Math.floor((fark / (1000 * 60 * 60)) % 24);
      const dakika = Math.floor((fark / (1000 * 60)) % 60);
      const saniye = Math.floor((fark / 1000) % 60);

      countdownElement.innerHTML =
        `📅 ${gun} gün, 🕒 ${saat} saat, ⏰ ${dakika} dakika, ⏳ ${saniye} saniye`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // BALONLAR
    const balonSayisi = 8;
    const balonRenkleri = [
      '#ff6f91', '#ff9671', '#ffc75f', '#d65f5f', '#a0c1b8', '#6a4c93', '#c06c84', '#355c7d'
    ];

    for(let i=0; i < balonSayisi; i++){
      const balon = document.createElement('div');
      balon.className = 'balloon';
      balon.style.background = `radial-gradient(circle at 50% 40%, ${balonRenkleri[i]}, darken(${balonRenkleri[i]}, 20%))`;
      balon.style.left = (Math.random() * (window.innerWidth - 80)) + 'px';
      balon.style.bottom = (Math.random() * 100 + 20) + 'px'; // sayfa içinde biraz yukarıdan başlasın
      balon.style.opacity = '1';
      balon.style.animation = `floatBalloon 5s linear forwards`;
      balon.style.animationDelay = (i * 0.6) + 's';
      balon.innerHTML = '<span>17</span>';

      balon.addEventListener('click', () => {
        balon.classList.toggle('clicked');
      });

      document.body.appendChild(balon);
    }

    // KALPLER
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.top = window.innerHeight + 30 + 'px';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 400);

    // KANFETİ
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      let W = window.innerWidth;
      let H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;

      const particles = [];
      const particleCount = 150;
      const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd'];

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H - H,
          r: Math.random() * 6 + 4,
          d: Math.random() * particleCount,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngle: 0,
          tiltAngleIncremental: (Math.random() * 0.07) + .05
        });
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach((p) => {
          ctx.beginPath();
          ctx.lineWidth = p.r;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
          ctx.stroke();
        });

        update();
      }

      function update() {
        particles.forEach((p) => {
          p.y += Math.cos(p.d) + 1 + p.r / 2;
          p.tiltAngle += p.tiltAngleIncremental;
          p.tilt = Math.sin(p.tiltAngle) * 15;

          if (p.y > H) {
            p.y = -10;
            p.x = Math.random() * W;
          }
        });
      }

      function loop() {
        draw();
        requestAnimationFrame(loop);
      }

      loop();
    }

    // Müzik kullanıcı tıklamasıyla başlar
    document.body.addEventListener("click", () => {
      music.play().catch(() => {});
    }, { once: true });

  </script>
</body>
</html>
