<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>🎉 Ece'nin Doğum Günü 🎉</title>
  <style>
    /* Genel stil */
    body {
      margin: 0;
      padding: 50px 20px;
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      text-align: center;
      overflow-x: hidden;
      height: 100vh;
      position: relative;
      user-select: none;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
      z-index: 1000;
      position: relative;
    }

    #countdown {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 15px 30px;
      display: inline-block;
      font-weight: 700;
      font-size: 2em;
      color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
      position: relative;
      z-index: 1000;
    }

    #message {
      font-size: 2em;
      margin-top: 2em;
      color: #ff1493;
      display: none;
      position: relative;
      z-index: 1000;
    }

    /* Carousel container */
    .carousel {
      position: relative;
      margin: 40px auto 0;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      background: #fff;
      user-select: none;
      z-index: 1000;

      /* Dinamik genişlik ve yükseklik için inline style ile JS ayarlayacak */
      width: auto;
      height: auto;
      transition: width 0.8s ease, height 0.8s ease;
      display: inline-block; /* Doğal boyuta göre */
    }

    /* Slides */
    .carousel-slide {
      display: none;
      border-radius: 20px;
      max-width: 100%;
      height: auto;
      transition: opacity 0.7s ease-in-out;
      position: absolute;
      top: 0;
      left: 0;
      user-select: none;
    }

    .carousel-slide.active {
      display: block;
      position: relative;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    /* Navigation buttons */
    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.8);
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      font-size: 2em;
      color: #ff007f;
      box-shadow: 0 0 10px rgba(255,0,127,0.5);
      transition: background 0.3s ease;
      user-select: none;
      z-index: 1100;
    }

    .carousel-button:hover {
      background: #ff007f;
      color: #fff;
    }

    .carousel-button.prev {
      left: 15px;
    }

    .carousel-button.next {
      right: 15px;
    }

    /* Kalp animasyonları */
    .heart {
      position: fixed;
      width: 30px;
      height: 30px;
      background-color: #ff1493;
      transform: rotate(-45deg);
      pointer-events: none;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
      filter: drop-shadow(0 0 3px #ff69b4);
      z-index: 900;
      border-radius: 5px;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: #ff1493;
      border-radius: 50%;
    }
    .heart::before {
      top: -15px;
      left: 0;
    }
    .heart::after {
      left: 15px;
      top: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(-45deg); opacity: 0.8; }
      100% { transform: translateY(-400px) rotate(-45deg); opacity: 0; }
    }

    /* Canvas konfeti z-index */
    canvas#confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 950;
    }
  </style>
</head>
<body>

  <h1>🎈 Ece'nin Doğum Gününe Geri Sayım 🎈</h1>
  <div id="countdown">Yükleniyor...</div>

  <div id="message">🎉 Doğum günün kutlu olsun Ece! Nice yıllara! 🎂💖</div>

  <!-- Carousel -->
  <div class="carousel" aria-label="Doğum Günü Fotoğraf Slayt Gösterisi" id="carousel">
   <img src="https://i.imgur.com/rVT9UUO.png" alt="Ece'nin doğum günü resmi 1" class="carousel-slide" />
    <img src="https://i.imgur.com/7u6Fibw.png" alt="Ece'nin doğum günü resmi 2" class="carousel-slide" />
    <img src="https://i.imgur.com/BG1pwTv.png" alt="Ece'nin doğum günü resmi 3" class="carousel-slide" />
    <img src="https://i.imgur.com/W14BEzn.png" alt="Ece'nin doğum günü resmi 4" class="carousel-slide" />
    <img src="https://i.imgur.com/lDN54hn.png" alt="Ece'nin doğum günü resmi 5" class="carousel-slide" />
    <button class="carousel-button prev" aria-label="Önceki fotoğraf">&#10094;</button>
    <button class="carousel-button next" aria-label="Sonraki fotoğraf">&#10095;</button>
  </div>

  <!-- Müzik -->
  <audio id="music" preload="auto" autoplay loop>
    <source src="until_i_found_you.mp3" type="audio/mpeg" />
    Tarayıcınız ses çaları desteklemiyor.
  </audio>

  <!-- Konfeti için canvas -->
  <canvas id="confetti-canvas"></canvas>

  <script>
    const countdownElement = document.getElementById('countdown');
    const messageElement = document.getElementById('message');
    const music = document.getElementById('music');

    // Hedef tarih: 29 Mayıs 00:00 (bugün 29 Mayıs veya sonrası ise gelecek yıl)
    const hedefTarih = new Date();
    if (hedefTarih.getMonth() > 4 || (hedefTarih.getMonth() === 4 && hedefTarih.getDate() > 29)) {
      hedefTarih.setFullYear(hedefTarih.getFullYear() + 1);
    }
    hedefTarih.setMonth(4);
    hedefTarih.setDate(29);
    hedefTarih.setHours(0, 0, 0, 0);

    // Geri sayım fonksiyonu
    function updateCountdown() {
      const now = new Date();
      const fark = hedefTarih - now;

      if (fark <= 0) {
        countdownElement.style.display = "none";
        messageElement.style.display = "block";
        startConfetti();
        // Otomatik müzik oynatma artık HTML autoplay ile
        return;
      }

      const gun = Math.floor(fark / (1000 * 60 * 60 * 24));
      const saat = Math.floor((fark / (1000 * 60 * 60)) % 24);
      const dakika = Math.floor((fark / (1000 * 60)) % 60);
      const saniye = Math.floor((fark / 1000) % 60);

      countdownElement.textContent =
        `📅 ${gun} gün, 🕒 ${saat} saat, ⏰ ${dakika} dakika, ⏳ ${saniye} saniye`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Carousel kontrol
    const carousel = document.getElementById('carousel');
    const slides = carousel.querySelectorAll('.carousel-slide');
    const prevBtn = carousel.querySelector('.carousel-button.prev');
    const nextBtn = carousel.querySelector('.carousel-button.next');
    let currentIndex = 0;
    let slideInterval;

    // Resim yüklenince container'ı doğal boyutuna göre ayarlama fonksiyonu
    function adjustCarouselSize(img) {
      const naturalWidth = img.naturalWidth;
      const naturalHeight = img.naturalHeight;
      carousel.style.width = naturalWidth + 'px';
      carousel.style.height = naturalHeight + 'px';
    }

    // Slayt göster
    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });
      currentIndex = index;

      const activeImage = slides[currentIndex];
      if (!activeImage.complete) {
        activeImage.onload = () => {
          adjustCarouselSize(activeImage);
        };
      } else {
        adjustCarouselSize(activeImage);
      }
    }

    function nextSlide() {
showSlide((currentIndex + 1) % slides.length);
}
function prevSlide() {
  showSlide((currentIndex - 1 + slides.length) % slides.length);
}

prevBtn.addEventListener('click', () => {
  prevSlide();
  resetSlideInterval();
});

nextBtn.addEventListener('click', () => {
  nextSlide();
  resetSlideInterval();
});

// Otomatik kaydırma
function startSlideInterval() {
  slideInterval = setInterval(nextSlide, 5000);
}
function resetSlideInterval() {
  clearInterval(slideInterval);
  startSlideInterval();
}

// Başlangıç
showSlide(currentIndex);
startSlideInterval();

// Kalpler animasyonu
function createHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.style.left = Math.random() * window.innerWidth + 'px';
  heart.style.animationDuration = (4 + Math.random() * 3) + 's';
  heart.style.opacity = Math.random();
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}
setInterval(createHeart, 400);

// Konfeti sistemi
const confettiCanvas = document.getElementById('confetti-canvas');
const ctx = confettiCanvas.getContext('2d');
let confettiElements = [];

function ConfettiParticle() {
  this.x = Math.random() * window.innerWidth;
  this.y = Math.random() * window.innerHeight - window.innerHeight;
  this.size = (Math.random() * 0.75 + 0.25) * 15;
  this.speed = (Math.random() * 1) + 0.5;
  this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
  this.opacity = Math.random() + 0.5;
  this.rotation = Math.random() * 360;
  this.rotationSpeed = (Math.random() - 0.5) * 10;
}

ConfettiParticle.prototype.update = function () {
  this.y += this.speed;
  this.rotation += this.rotationSpeed;
  if (this.y > window.innerHeight) {
    this.y = 0;
    this.x = Math.random() * window.innerWidth;
  }
};

ConfettiParticle.prototype.draw = function () {
  ctx.save();
  ctx.translate(this.x, this.y);
  ctx.rotate((this.rotation * Math.PI) / 180);
  ctx.fillStyle = this.color;
  ctx.globalAlpha = this.opacity;
  ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
  ctx.restore();
};

function startConfetti() {
  confettiElements = [];
  for (let i = 0; i < 150; i++) {
    confettiElements.push(new ConfettiParticle());
  }
  confettiLoop();
}

function confettiLoop() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  confettiElements.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(confettiLoop);
}

// Canvas boyutunu güncelle
function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script> </body> </html> ```
