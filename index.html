    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, FieldValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        let db, auth;
        let userId = null;
        
        // Bu, farklı ortamlar için akıllıca Firebase'i başlatacak olan fonksiyondur.
        async function initializeFirebaseAndListen() {
            // Ortamdan gelen global değişkenleri kullanmaya çalış.
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            // Eğer konfigürasyon yoksa hata ver.
            if (!firebaseConfig) {
                console.error("Firebase yapılandırma bilgileri bulunamadı.");
                return;
            }

            try {
                // Firebase uygulamasını başlat.
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Özel token varsa giriş yap, yoksa anonim olarak devam et.
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                // Auth durumu değiştiğinde kullanıcı bilgilerini al ve dinlemeyi başlat.
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        console.log("Firebase: Kullanıcı doğrulandı, UID:", userId);
                        attachGuestbookListeners(appId);
                    } else {
                        console.log("Firebase: Anonim oturum.");
                        userId = null;
                    }
                });
            } catch (error) {
                console.error("Firebase başlatma hatası: ", error);
            }
        }
        
        // Ziyaretçi defteri için event listener'ları ve Firestore dinleyicilerini bağlar.
        function attachGuestbookListeners(appId) {
            const commentForm = document.getElementById('commentForm');
            const commentsList = document.getElementById('commentsList');
            const submitBtn = document.getElementById('submit-comment-btn');

            if (!commentForm || !commentsList || !submitBtn) {
                console.warn('Ziyaretçi defteri elementleri henüz hazır değil. Tekrar deneniyor...');
                setTimeout(() => attachGuestbookListeners(appId), 100);
                return;
            }

            // Yorum gönderme (server timestamp kullanıyoruz)
            submitBtn.addEventListener('click', async (event) => {
                event.preventDefault();
                const commentName = document.getElementById('commentName').value.trim();
                const commentText = document.getElementById('commentText').value.trim();

                if (!commentName || !commentText) return;

                submitBtn.disabled = true;

                try {
                    // Yorumları herkese açık bir koleksiyonda sakla.
                    await addDoc(collection(db, `artifacts/${appId}/public/data/guestbook`), {
                        name: commentName,
                        text: commentText,
                        timestamp: new Date()
                    });
                    commentForm.reset();
                    console.log("Yorum veritabanına başarıyla kaydedildi.");
                } catch (err) {
                    console.error("Yorum eklenirken hata oluştu: ", err);
                } finally {
                    submitBtn.disabled = false;
                }
            });

            // Yorumları gerçek zamanlı dinle
            const q = query(collection(db, `artifacts/${appId}/public/data/guestbook`));
            onSnapshot(q, (querySnapshot) => {
                const comments = [];
                querySnapshot.forEach((doc) => {
                    const commentData = doc.data();
                    comments.push({
                        ...commentData,
                        id: doc.id
                    });
                });

                // Yorumları JavaScript içinde timestamp'e göre sırala (yeni yorumlar en üstte)
                comments.sort((a, b) => (b.timestamp?.toDate()?.getTime() || 0) - (a.timestamp?.toDate()?.getTime() || 0));

                commentsList.innerHTML = '';
                comments.forEach(comment => {
                    const commentElement = document.createElement('div');
                    commentElement.classList.add('comment-card', 'animate-fade-in');
                    
                    const date = comment.timestamp?.toDate ? comment.timestamp.toDate() : new Date();
                    const formattedDate = date.toLocaleDateString('tr-TR') + ' ' + date.toLocaleTimeString('tr-TR');
                    
                    commentElement.innerHTML = `
                        <p class="font-bold text-lg text-primary-blue">${escapeHtml(comment.name)}</p>
                        <p class="mt-2 text-text-light text-md">${escapeHtml(comment.text)}</p>
                        <p class="text-xs text-gray-500 mt-2">${formattedDate}</p>
                    `;
                    commentsList.appendChild(commentElement);
                });
            }, (error) => {
                console.error("Yorumlar dinlenirken hata oluştu: ", error);
            });
            
            // Basit XSS koruması için escape fonksiyonu
            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replaceAll('&', '&amp;')
                    .replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;')
                    .replaceAll('"', '&quot;')
                    .replaceAll("'", '&#39;');
            }
        }
    
        // Başlangıçta Firebase'i başlat
        initializeFirebaseAndListen();

    </script>

        // --- Fonksiyonlar ---

        function setupHearts() {
            heartGrid.innerHTML = '';
            for (let i = 0; i < heartButtonCount; i++) {
                const button = document.createElement('button');
                button.classList.add('heart-button', 'w-16', 'h-16', 'bg-gray-700', 'rounded-2xl', 'flex', 'items-center', 'justify-center', 'text-2xl', 'text-pink-300', 'transition-all', 'duration-300', 'transform', 'hover:scale-110', 'hover:shadow-pink-glow');
                button.innerHTML = '❤️';
                button.dataset.index = i;
                button.addEventListener('click', handleHeartClick);
                heartGrid.appendChild(button);
            }
            hearts = document.querySelectorAll('.heart-button');
        }

        function generateSequence() {
            const newSequence = [];
            for (let i = 0; i < sequenceLength; i++) {
                newSequence.push(Math.floor(Math.random() * heartButtonCount));
            }
            return newSequence;
        }

        function playSequence() {
            isPlaying = true;
            startButton.disabled = true;
            userSequence = [];
            hearts.forEach(heart => heart.classList.remove('lighted-heart'));
            feedbackMessage.classList.add('hidden');
            
            let i = 0;
            const interval = setInterval(() => {
                if (i < sequence.length) {
                    const heart = hearts[sequence[i]];
                    heart.classList.add('lighted-heart');
                    setTimeout(() => heart.classList.remove('lighted-heart'), 500);
                    i++;
                } else {
                    clearInterval(interval);
                    isPlaying = false;
                }
            }, 700);
        }

        function handleHeartClick(event) {
            if (isPlaying) {
                const clickedIndex = parseInt(event.target.dataset.index);
                userSequence.push(clickedIndex);
                
                if (userSequence.length <= sequence.length) {
                    if (userSequence[userSequence.length - 1] === sequence[userSequence.length - 1]) {
                        // Correct click
                        event.target.classList.add('lighted-heart');
                        setTimeout(() => event.target.classList.remove('lighted-heart'), 500);
                        
                        if (userSequence.length === sequence.length) {
                            // Password correct
                            setTimeout(showMainApp, 800);
                        }
                    } else {
                        // Wrong click
                        userSequence = [];
                        feedbackMessage.classList.remove('hidden');
                        setTimeout(() => {
                            feedbackMessage.classList.add('hidden');
                            startButton.disabled = false;
                        }, 1500);
                    }
                }
            }
        }

        function showMainApp() {
            passwordPage.classList.add('password-page-hidden');
            setTimeout(() => {
                passwordPage.classList.add('hidden');
                appContainer.classList.remove('hidden');
                appContainer.classList.add('animate-fade-in');
                loadContent('home');
            }, 700);
        }

        function loadContent(page) {
            let content = '';
            let activeNavButton = null;

            // Önceki aktif düğmeleri ve içeriği temizle
            document.querySelectorAll('.nav-button').forEach(btn => {
                btn.classList.remove('bg-primary-blue', 'shadow-lg', 'text-secondary-pink');
                btn.classList.add('hover:bg-gray-700', 'text-gray-400');
            });
            
            // Ana içerik alanını temizle
            contentArea.innerHTML = '';
            
            switch (page) {
                case 'home':
                    content = homePageContent;
                    activeNavButton = navHomeBtn || navHomeDesktopBtn;
                    break;
                case 'memories':
                    content = memoriesPageContent;
                    activeNavButton = navMemoriesBtn || navMemoriesDesktopBtn;
                    break;
                case 'art':
                    content = artPageContent;
                    activeNavButton = navArtBtn || navArtDesktopBtn;
                    break;
                case 'message':
                    content = messagePageContent;
                    activeNavButton = navMessageBtn || navMessageDesktopBtn;
                    break;
                case 'guestbook':
                    content = guestbookPageContent;
                    activeNavButton = navGuestbookBtn || navGuestbookDesktopBtn;
                    break;
                default:
                    content = homePageContent;
                    activeNavButton = navHomeBtn || navHomeDesktopBtn;
            }

            // Aktif navigasyon butonunu işaretle
            if (activeNavButton) {
                activeNavButton.classList.remove('hover:bg-gray-700', 'text-gray-400');
                activeNavButton.classList.add('bg-primary-blue', 'shadow-lg', 'text-secondary-pink');
            }
            
            contentArea.innerHTML = content;
            
            // Özel sayfa fonksiyonlarını çalıştır
            if (page === 'home') {
                updateCountdown();
                setInterval(updateCountdown, 1000);
            }
            if (page === 'message') {
                typewriterEffect();
            }
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = birthdayDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            if (distance < 0) {
                document.getElementById('countdown-text').innerText = "Mutlu Yıllar, Ece!";
                return;
            }

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }

        const messageText = "Canım sevgilim, seninle geçirdiğim her an, kalbimde büyüyen bir hikayenin en güzel bölümü. İyi ki doğmuşsun. Hayatım, seninle anlam buluyor. Seni çok seviyorum. ❤️";
        let messageIndex = 0;
        let typingInterval;

        function typewriterEffect() {
            const textElement = document.getElementById('message-text');
            if (!textElement) return;
            textElement.innerText = '';
            messageIndex = 0;
            
            if (typingInterval) clearInterval(typingInterval);
            
            typingInterval = setInterval(() => {
                if (messageIndex < messageText.length) {
                    textElement.innerHTML += messageText.charAt(messageIndex);
                    messageIndex++;
                } else {
                    clearInterval(typingInterval);
                }
            }, 50); // Yazma hızı (ms)
        }

        function copyToClipboard() {
            const text = messageText;
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                const successful = document.execCommand('copy');
                const msg = successful ? 'Kopyalandı!' : 'Kopyalanamadı.';
                showModal(msg);
            } catch (err) {
                showModal('Kopyalama başarısız oldu.');
            }
            document.body.removeChild(tempInput);
        }

        function showModal(message) {
            const modal = document.createElement('div');
            modal.classList.add('fixed', 'inset-0', 'flex', 'items-center', 'justify-center', 'z-50', 'p-4');
            modal.innerHTML = `
                <div class="bg-card-dark rounded-xl p-6 text-center shadow-lg transform scale-100 transition-transform duration-300">
                    <p class="text-xl text-text-light font-bold mb-4">${message}</p>
                    <button class="px-4 py-2 bg-primary-blue text-white rounded-lg hover:bg-blue-600 transition-colors" onclick="this.parentNode.parentNode.remove()">Tamam</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // --- Canvas Animations ---

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createHearts() {
            hearts = [];
            for (let i = 0; i < heartCount; i++) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 5 + 2,
                    speedY: Math.random() * 0.5 + 0.1,
                    opacity: Math.random() * 0.5 + 0.3,
                    color: heartColors[Math.floor(Math.random() * heartColors.length)],
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.01,
                });
            }
        }

        function drawHearts() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach(heart => {
                ctx.save();
                ctx.translate(heart.x, heart.y);
                ctx.rotate(heart.rotation);
                ctx.fillStyle = heart.color;
                ctx.globalAlpha = heart.opacity;
                ctx.beginPath();
                ctx.moveTo(0, -heart.size);
                ctx.bezierCurveTo(heart.size, -heart.size, heart.size, 0, 0, heart.size * 1.5);
                ctx.bezierCurveTo(-heart.size, 0, -heart.size, -heart.size, 0, -heart.size);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });
        }

        function updateHearts() {
            hearts.forEach(heart => {
                heart.y -= heart.speedY;
                heart.rotation += heart.rotationSpeed;
                if (heart.y < -20) {
                    heart.y = canvas.height + 20;
                    heart.x = Math.random() * canvas.width;
                }
            });
        }

        function animate() {
            updateHearts();
            drawHearts();
            requestAnimationFrame(animate);
        }


        // --- Event Listeners and Initial Setup ---

        window.onload = function() {
            setupHearts();
            resizeCanvas();
            createHearts();
            animate();
            
            startButton.addEventListener('click', () => {
                sequence = generateSequence();
                playSequence();
            });

            // Navigasyon butonları
            navHomeBtn.addEventListener('click', () => loadContent('home'));
            navMemoriesBtn.addEventListener('click', () => loadContent('memories'));
            navArtBtn.addEventListener('click', () => loadContent('art'));
            navMessageBtn.addEventListener('click', () => loadContent('message'));
            navGuestbookBtn.addEventListener('click', () => loadContent('guestbook'));
            
            navHomeDesktopBtn.addEventListener('click', () => loadContent('home'));
            navMemoriesDesktopBtn.addEventListener('click', () => loadContent('memories'));
            navArtDesktopBtn.addEventListener('click', () => loadContent('art'));
            navMessageDesktopBtn.addEventListener('click', () => loadContent('message'));
            navGuestbookDesktopBtn.addEventListener('click', () => loadContent('guestbook'));
        };

        window.addEventListener('resize', resizeCanvas);

    </script>
