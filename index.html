                        'fade-in': 'fadeIn 1s ease-in-out',

                        'light-up': 'lightUp 0.5s ease-out forwards',

                        'message-slide-in': 'messageSlideIn 1s ease-in-out 0.8s forwards',

                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(50px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        pulseGrow: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.05)' }
                        },
                        lightUp: {
                            '0%': { 'background-color': '#FF69B4' },
                            '100%': { 'background-color': '#FFD1DC' }

                        messageAppear: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' }
                        },
                        messageSlideIn: {
                            '0%': { transform: 'translateY(100%)', opacity: 0 },
                            '100%': { transform: 'translateY(0)', opacity: 1 }
                        },
                        blink: {

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #E0E0E0;

            will-change: transform, opacity; 
            overflow-y: auto;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }
        .ui-container {

        .password-page-transition {
            transition: all 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .password-page-hidden {
            transform: scale(0.8) translateY(-50px);
            opacity: 0;
            pointer-events: none;
        }
        .lighted-heart {

        }

        .photo-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(255, 105, 180, 0.5), 0 4px 6px -2px rgba(255, 105, 180, 0.2);
        }
        .image-container {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.2);

            will-change: transform, box-shadow;

        }

        .image-container:hover {
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.7);
            transform: scale(1.05);
        }
        
        .photo-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 0.5rem;
            text-align: center;
            font-size: 0.875rem;
            opacity: 0;

        }
        .image-container:hover .photo-caption {

        }

        }
        .message-box-transition {
            transition: all 1s ease-in-out;
        }

            height: 80vh; /* Ekran yüksekliğinin %80'i */

        // --- Core Functions ---
        
        function resizeCanvas() {
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        }

        function createHeart() {
            const size = Math.random() * 20 + 20; 
            const color = heartColors[Math.floor(Math.random() * heartColors.length)];
            hearts.push({
                x: Math.random() * canvas.width,
                y: -size, 
                size: size,
                speed: Math.random() * 0.5 + 0.5,
                color: color,
                opacity: 0.1,
            });
        }
        
        function drawHearts() {
            if (ctx) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < hearts.length; i++) {
                    const h = hearts[i];
                    ctx.save();
                    ctx.translate(h.x, h.y);
                    
                    ctx.beginPath();
                    ctx.moveTo(0, h.size * 0.4);
                    ctx.bezierCurveTo(0, -h.size * 0.2, h.size * 0.6, h.size * 0.4, 0, h.size);
                    ctx.bezierCurveTo(-h.size * 0.6, h.size * 0.4, 0, -h.size * 0.2, 0, h.size * 0.4);
                    
                    ctx.fillStyle = h.color;
                    ctx.globalAlpha = h.opacity;
                    ctx.fill();
                    ctx.restore();
                }
            }
        }
        
        function updateHearts() {
            for (let i = 0; i < hearts.length; i++) {
                hearts[i].y += hearts[i].speed;
            }
            hearts = hearts.filter(h => h.y < canvas.height + 20);

            if (hearts.length < heartCount) {
                createHeart();
            }
        }
        
        function animate() {
            updateHearts();
            drawHearts();
            requestAnimationFrame(animate);
        }

        function renderPage(pageName) {
            // Sayfa içeriğini yüklemeden önce kaydırmayı en üste sıfırla
            window.scrollTo({ top: 0, behavior: 'auto' }); 
            
            contentArea.classList.add('opacity-0');
            setTimeout(() => {
                contentArea.innerHTML = '';
                if (pageName === 'home') {
                    contentArea.innerHTML = homePageContent;
                    updateCountdown(); 
                    startCountdown();
                    setActiveNav('home');
                } else if (pageName === 'memories') {
                    contentArea.innerHTML = memoriesPageContent;
                    setActiveNav('memories');
                } else if (pageName === 'us') {
                    contentArea.innerHTML = usPageContent;
                    setActiveNav('us');
                } else if (pageName === 'eyes') {
                    contentArea.innerHTML = eyesPageContent;
                    setActiveNav('eyes');
                } else if (pageName === 'art') {
                    contentArea.innerHTML = artGalleryContent;
                    setActiveNav('art');
                } else if (pageName === 'message') {
                    contentArea.innerHTML = messagePageContent;
                    setActiveNav('message');
                    setTimeout(attachMessageButtonListener, 100);
                }
                contentArea.classList.remove('opacity-0');
            }, 500);
        }

                navEyesDesktopBtn.classList.remove('hover:bg-gray-700');
            } else if (pageName === 'art') {
                navArtDesktopBtn.classList.add('bg-primary-blue', 'shadow-lg');
                navArtDesktopBtn.classList.remove('hover:bg-gray-700');
            } else if (pageName === 'message') {
                navMessageDesktopBtn.classList.add('bg-primary-blue', 'shadow-lg');
                navMessageDesktopBtn.classList.remove('hover:bg-gray-700');
            }
        }
        
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = birthdayDate - now;

            if (distance > 0) {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                const daysEl = document.getElementById('days');
                const hoursEl = document.getElementById('hours');
                const minutesEl = document.getElementById('minutes');
                const secondsEl = document.getElementById('seconds');
                
                if(daysEl) daysEl.textContent = days;
                if(hoursEl) hoursEl.textContent = hours;
                if(minutesEl) minutesEl.textContent = minutes;
                if(secondsEl) secondsEl.textContent = seconds;
            } else {
                const countdownTextEl = document.getElementById('countdown-text');
                // Adı "Başak" olarak güncellendi.
                if(countdownTextEl) countdownTextEl.textContent = "Doğum Günün Kutlu Olsun, Başak!";
            }
        }
        
        function startCountdown() {
            // Kontrol: Zaten bir geri sayım aralığı varsa, yenisini başlatma
            if (window.countdownInterval) return; 
            window.countdownInterval = setInterval(() => {
                updateCountdown();
            }, 1000);
        }

        const messages = [
            "Merhaba Başak", 
            "Bugün hayatımda en çok değer verdiğim kişinin doğum günü, Doğum gününü tüm kalbimle ve içtenliğimle kutluyorum. Dünyaya geldiğin ve birçok insanın hayatına renk kattığın o özel gün. 18. yaşına girdin yeni yaşının sana huzur, mutluluk ve içten gülümsemeler getirmesini diliyorum.",
            "Seninle tanıştığım günden beri hayatımda bir şeyler değişti. Ne değişti hemen sana anlatayım; Öncelikle senin varlığın, en sıradan günleri bile güzel yapmayı başarıyor. Gülüşün içimi ısıtıyor, enerjin her şeye renk katıyor. Ne zaman moralsiz olsam, seni görünce ya da aklımda olduğunda yüzümde bir tebessüm beliriyor sebebini gerçekten bende bilmiyorum ama galiba sana duyduğum sevgiden, yine de varlığın için teşekkür ederim.",
            "Bazen sadece sohbet etmek, sessizce yan yana durmak bile yetiyor. Çünkü senin yanında yaptığım her şey doğal, her şey gerçek. Senin varlığın ve kendin bana huzur vermeye yeterli oluyor bu yüzden seninle geçirdiğim her an benim için çok değerli ve anlamlı.",
            "Zaman zaman güldük, bazen üzüldük ama ne olursa olsun senin yanında olmak, seni anlamak ve desteklemek benim için hep çok özel bir şey ve öylede kalacak. Hayat bazen zor olsa da, senin gibi birini tanımış olmak gerçekten her şeye değer.",
            "Biliyorum bazen bazı şeyler için üzülebiliyosun ya da kalbin kırılabiliyor, ama bilmeni isterim ki ben seni her zaman destekledim ve her an da desteklemeye devam edeceğim. Bazen kendini çok fazla üzdüğünü düşünüyorum ve kalbindekileri hissedebiliyorum, belki bazen kendini yanlız hissediyor olabilirsin ama bilmeni isterim ki ne yaşarsan yaşa ya da ne olursa olsun ben daima dinleyeceğim ve tüm kalbimle destekleyeceğim. İçini dökmek istediğinde ya da bir şey anlatmak istediğinde ben hep senin için burada olacağım. Senden yaşadığın acılardan kaçmanı değil onlarla savaşmanı istiyorum, kendini üzüp boyun eğme ve her zaman diren. Çünkü senin gibi güçlü bir hanımefendiye bunları yapmak yakışır.
            "İyi ki doğdun, iyi ki bu dünyadasın, iyi ki yollarımız kesişti Başak. Senin gibi bir arkadaşa sahip olduğum için kendimi çok şanslı hissediyorum. Umarım bu yeni yaşında her şey gönlünce olur, kalbinden ne geçiyorsa hepsi birer birer gerçekleşir.",
            "Bu siteyi yapma ve oluşturma amacım, sadece sana özel anılarımızı ve sana olan sevgimi ölümsüzleştirmek için bir hediye. Lütfen her sayfanın tadını çıkar ve bu küçük sürprizin sana ne kadar değer verdiğimi hatırlatmasını dile. Seni çok seviyorum ve her zaman seveceğim, iyi ki varsın.",
            "Sevgilerimle, Tuna..."
        ];
        
        const typingDelay = 50; 
        const paragraphDelay = 1500; 
        
        async function typeMessageContent() {
            const allMessagesContainer = document.getElementById('all-messages-container');
            if (!allMessagesContainer) return;
            allMessagesContainer.innerHTML = ''; 

            for (let i = 0; i < messages.length; i++) {
                const p = document.createElement('p');
                p.classList.add('font-light', 'text-base', 'md:text-lg', 'mb-4'); 
                allMessagesContainer.appendChild(p);

                for (let j = 0; j < messages[i].length; j++) {
                    // Performans İyileştirmesi: textContent yerine innerHTML kullanılarak eklenen karakterin daha az DOM manipülasyonu yapması sağlanır
                    p.innerHTML += messages[i][j]; 
                    await new Promise(resolve => setTimeout(resolve, typingDelay));
                }

                if (i === messages.length - 1) {
                    const cursor = document.createElement('span');
                    cursor.id = 'cursor';
                    cursor.classList.add('text-sm', 'md:text-md', 'text-secondary-pink', 'inline-block', 'w-2', 'h-4', 'bg-secondary-pink', 'animate-blinking-cursor', 'align-middle');
                    allMessagesContainer.appendChild(cursor);
                } else {
                    await new Promise(resolve => setTimeout(resolve, paragraphDelay));
                }
            }
        }

        function attachMessageButtonListener() {
            const showMessageBtn = document.getElementById('show-message-btn');
            const allMessagesContainer = document.getElementById('all-messages-container');
            if (showMessageBtn) {
                showMessageBtn.addEventListener('click', () => {
                    showMessageBtn.classList.add('opacity-0', 'scale-90');
                    setTimeout(() => {
                        showMessageBtn.classList.add('hidden');
                        allMessagesContainer.classList.remove('hidden');
                        typeMessageContent(); 
                    }, 500); 
                });
            }
        }

        // --- Password Game Logic ---
        function generateSequence() {
            const newSequence = [];
            for (let i = 0; i < sequenceLength; i++) {
                newSequence.push(Math.floor(Math.random() * heartButtonCount));
            }
            return newSequence;
        }

        function playSequence() {
            isPlaying = true;
            startButton.disabled = true;
            startButton.classList.add('opacity-50', 'cursor-not-allowed');

            let i = 0;
            const hearts = document.querySelectorAll('#heart-grid .heart-icon-btn');
            const interval = setInterval(() => {
                if (i < sequence.length) {
                    const heart = hearts[sequence[i]];
                    heart.classList.add('lighted-heart');
                    setTimeout(() => {
                        heart.classList.remove('lighted-heart');
                    }, 500);
                    i++;
                } else {
                    clearInterval(interval);
                    isPlaying = false;
                    startButton.disabled = false;
                    startButton.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 700);
        }

        function checkSequence() {
            if (userSequence.length !== sequence.length) return false;
            for (let i = 0; i < sequence.length; i++) {
                if (userSequence[i] !== sequence[i]) {
                    return false;
                }
            }
            return true;
        }
        
        function createHeartButtons() {
            if (!heartGrid) {
                console.error("Hata: 'heart-grid' elementi bulunamadı. Butonlar oluşturulamıyor.");
                return;
            }
            
            heartGrid.innerHTML = ''; 
            for(let i = 0; i < heartButtonCount; i++) {
                const button = document.createElement('button');
                button.classList.add('heart-icon-btn', 'aspect-square', 'bg-gray-700', 'rounded-full', 'flex', 'items-center', 'justify-center', 'text-2xl', 'text-secondary-pink', 'shadow-md', 'hover:bg-gray-600', 'transition-colors', 'duration-300');
                button.dataset.index = i;
                button.innerHTML = `&hearts;`; 

                button.addEventListener('click', (event) => {
                    if (isPlaying) return;
                    const index = parseInt(event.currentTarget.dataset.index);
                    userSequence.push(index);

                    const clickedHeart = event.currentTarget;
                    clickedHeart.classList.add('lighted-heart');
                    setTimeout(() => {
                        clickedHeart.classList.remove('lighted-heart');
                    }, 500);
                    
                    if (userSequence.length === sequence.length) {
                        if (checkSequence()) {
                            passwordPage.classList.add('password-page-hidden');
                            setTimeout(() => {
                                passwordPage.classList.add('hidden');
                                appContainer.classList.remove('hidden');
                                renderPage('home');
                            }, 500);
                        } else {
                            feedbackMessage.classList.remove('hidden');
                            userSequence = [];
                            setTimeout(() => {
                                feedbackMessage.classList.add('hidden');
                            }, 2000);
                            setTimeout(() => {
                                sequence = generateSequence();
                                playSequence();
                            }, 2500);
                        }
                    }
                });
                heartGrid.appendChild(button);
            }
        }
        
        // --- Event Listeners ---
        if (startButton) {
            startButton.addEventListener('click', () => {
                userSequence = [];
                sequence = generateSequence();
                playSequence();
            });
        }
        
        if (navHomeBtn) navHomeBtn.addEventListener('click', () => renderPage('home'));
        if (navMemoriesBtn) navMemoriesBtn.addEventListener('click', () => renderPage('memories'));
        if (navUsBtn) navUsBtn.addEventListener('click', () => renderPage('us'));
        if (navEyesBtn) navEyesBtn.addEventListener('click', () => renderPage('eyes'));
        if (navArtBtn) navArtBtn.addEventListener('click', () => renderPage('art'));
        if (navMessageBtn) navMessageBtn.addEventListener('click', () => renderPage('message'));

        if (navHomeDesktopBtn) navHomeDesktopBtn.addEventListener('click', () => renderPage('home'));
        if (navMemoriesDesktopBtn) navMemoriesDesktopBtn.addEventListener('click', () => renderPage('memories'));
        if (navUsDesktopBtn) navUsDesktopBtn.addEventListener('click', () => renderPage('us'));
        if (navEyesDesktopBtn) navEyesDesktopBtn.addEventListener('click', () => renderPage('eyes'));
        if (navArtDesktopBtn) navArtDesktopBtn.addEventListener('click', () => renderPage('art'));
        if (navMessageDesktopBtn) navMessageDesktopBtn.addEventListener('click', () => renderPage('message'));
        
        // DOM içeriği yüklendikten sonra her şeyi başlat
        document.addEventListener('DOMContentLoaded', () => {
            createHeartButtons();
            resizeCanvas();
            animate();
            window.addEventListener('resize', resizeCanvas);
        });

    </script>
