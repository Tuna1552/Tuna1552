<style>
  /* ... önceki stil kodları ... */

  /* BALONLAR */
  .balloon {
    position: absolute;
    width: 60px;
    height: 80px;
    background: radial-gradient(circle at 50% 40%, #ff6f91, #d32f6f);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    transition: transform 0.3s ease;
    user-select: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-weight: bold;
    font-size: 22px;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .balloon span {
    margin-bottom: 10px;
    display: none;
  }
  .balloon.clicked span {
    display: block;
  }
  .balloon:hover {
    transform: scale(1.1);
    filter: drop-shadow(0 0 8px #ff6f91);
  }
  .balloon::after {
    content: "";
    position: absolute;
    bottom: -15px;
    left: 50%;
    width: 2px;
    height: 25px;
    background: #444;
    transform: translateX(-50%);
    border-radius: 1px;
  }

  /* Balonların yukarı yavaş çıkma animasyonu */
  @keyframes floatBalloon {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-150px); opacity: 1; }
  }

  /* Kalpler */
  .heart {
    position: fixed;
    width: 30px;
    height: 30px;
    background-color: #ff1493;
    transform: rotate(-45deg);
    pointer-events: none;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
    filter: drop-shadow(0 0 3px #ff69b4);
    z-index: 998;
  }
  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 30px;
    height: 30px;
    background-color: #ff1493;
    border-radius: 50%;
  }
  .heart::before {
    top: -15px;
    left: 0;
  }
  .heart::after {
    left: 15px;
    top: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(-45deg); opacity: 0.8; }
    100% { transform: translateY(-400px) rotate(-45deg); opacity: 0; }
  }

</style>

<body>
  <!-- Önceki içerik aynı -->

<script>
  // Önceki js kodları aynı

  // BALONLAR - şimdi aşağıdaki gibi:
  const balonSayisi = 8;
  const balonRenkleri = [
    '#ff6f91', '#ff9671', '#ffc75f', '#d65f5f', '#a0c1b8', '#6a4c93', '#c06c84', '#355c7d'
  ];

  for(let i=0; i < balonSayisi; i++){
    const balon = document.createElement('div');
    balon.className = 'balloon';
    balon.style.background = `radial-gradient(circle at 50% 40%, ${balonRenkleri[i]}, darken(${balonRenkleri[i]}, 20%))`;
    balon.style.left = (Math.random() * (window.innerWidth - 80)) + 'px';
    balon.style.bottom = (Math.random() * 100 + 20) + 'px'; // Görünürde başlayacak
    balon.style.opacity = '1';
    balon.style.animation = `floatBalloon 5s linear forwards`; // sadece 5 sn yavaş yukarı
    balon.style.animationDelay = (i * 0.6) + 's'; // sıra ile hafif delayli
    balon.innerHTML = '<span>17</span>';

    balon.addEventListener('click', () => {
      balon.classList.toggle('clicked');
    });

    document.body.appendChild(balon);
  }

  // MÜZİK KONTROLÜ:
