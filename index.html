<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>🎉 Ece'nin Doğum Günü 🎉</title>
  <style>
    /* Genel stil */
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      position: relative;
      text-align: center;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
      z-index: 1000;
      position: relative;
      color: #ff1493;
      text-shadow: 0 0 8px #ff69b4;
    }

    #countdown {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 20px 40px;
      font-weight: 700;
      font-size: 2em;
      color: #ff007f;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
      margin-top: 10px;
      user-select: text;
      min-width: 350px;
      transition: opacity 0.5s ease;
      display: none;
    }

    #message {
      font-size: 2.2em;
      margin-top: 2em;
      color: #ff1493;
      text-shadow: 0 0 8px #ff69b4;
      display: none;
      position: relative;
      z-index: 1000;
    }

    /* Buton */
    #play-music-btn, #start-quiz-btn {
      padding: 15px 40px;
      font-size: 1.5em;
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff1493, #ff69b4);
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 20, 147, 0.7);
      transition: background 0.3s ease, transform 0.3s ease;
      user-select: none;
      margin-top: 20px;
      z-index: 1100;
    }
    #play-music-btn:hover, #start-quiz-btn:hover {
      background: linear-gradient(45deg, #ff69b4, #ff1493);
      transform: scale(1.05);
    }
    #play-music-btn:active, #start-quiz-btn:active {
      transform: scale(0.95);
    }

    /* Quiz stil */
    #quiz-container {
      display: none; /* Başlangıçta gizli */
      margin-top: 20px;
      text-align: left;
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
    }

    .question {
      font-size: 1.2em;
      margin-bottom: 10px;
    }

    .option {
      margin: 5px 0;
    }

    .option input {
      margin-right: 10px;
    }

    /* Carousel container */
    .carousel {
      position: relative;
      margin: 40px auto 0;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      background: #fff;
      user-select: none;
      z-index: 1000;
      width: auto;
      height: auto;
      display: inline-block;
      max-width: 90vw;
    }

    /* Slides */
    .carousel-slide {
      display: none;
      border-radius: 20px;
      max-width: 100%;
      height: auto;
      position: absolute;
      top: 0;
      left: 0;
    }

    .carousel-slide.active {
      display: block;
      position: relative;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    /* Navigation buttons */
    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      font-size: 2em;
      color: #ff007f;
      box-shadow: 0 0 15px rgba(255,0,127,0.7);
      transition: background 0.3s ease;
      user-select: none;
      z-index: 1100;
    }

    .carousel-button:hover {
      background: #ff007f;
      color: #fff;
      box-shadow: 0 0 20px #ff007f;
    }

    .carousel-button.prev {
      left: 15px;
    }

    .carousel-button.next {
      right: 15px;
    }

    /* Kalp animasyonları */
    .heart {
      position: fixed;
      width: 30px;
      height: 30px;
      background-color: #ff1493;
      transform: rotate(-45deg);
      pointer-events: none;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
      filter: drop-shadow(0 0 3px #ff69b4);
      z-index: 900;
      border-radius: 5px;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: #ff1493;
      border-radius: 50%;
    }
    .heart::before {
      top: -15px;
      left: 0;
    }
    .heart::after {
      left: 15px;
      top: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(-45deg); opacity: 0.8; }
      100% { transform: translateY(-400px) rotate(-45deg); opacity: 0; }
    }

    /* Canvas konfeti z-index */
    canvas#confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 950;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <h1>🎈 Ece'nin Doğum Gününe Geri Sayım 🎈</h1>

  <button id="play-music-btn" aria-label="Müziği Başlat">🎵 Müziği Başlat</button>
  <button id="start-quiz-btn" aria-label="Quiz'i Başlat" style="display:none;">🎉 Ece'nin Quizini Başlat</button>

  <div id="countdown" aria-live="polite"></div>

  <div id="message" role="alert" aria-live="assertive">
    🎉 Doğum günün kutlu olsun Ece! Nice yıllara! 🎂💖
  </div>

  <!-- Carousel -->
  <div class="carousel" aria-label="Doğum Günü Fotoğraf Slayt Gösterisi" id="carousel">
    <img src="https://i.imgur.com/rVT9UUO.png" alt="Ece'nin doğum günü resmi 1" class="carousel-slide active" />
    <img src="https://i.imgur.com/7u6Fibw.png" alt="Ece'nin doğum günü resmi 2" class="carousel-slide" />
    <img src="https://i.imgur.com/BG1pwTv.png" alt="Ece'nin doğum günü resmi 3" class="carousel-slide" />
    <img src="https://i.imgur.com/W14BEzn.png" alt="Ece'nin doğum günü resmi 4" class="carousel-slide" />
    <img src="https://i.imgur.com/lDN54hn.png" alt="Ece'nin doğum günü resmi 5" class="carousel-slide" />
    <button class="carousel-button prev" aria-label="Önceki fotoğraf" id="prevBtn">&#10094;</button>
    <button class="carousel-button next" aria-label="Sonraki fotoğraf" id="nextBtn">&#10095;</button>
  </div>

  <!-- Quiz Container -->
  <div id="quiz-container">
    <h2>🎉 Ece'nin Quizine Hoş Geldiniz! 🎉</h2>
    <div id="question-container"></div>
    <button id="next-question-btn">İleri</button>
    <div id="quiz-result" style="margin-top: 20px;"></div>
  </div>

  <!-- Müzik -->
  <audio id="music" preload="auto" loop>
    <source src="until_i_found_you.mp3" type="audio/mpeg" />
    Tarayıcınız ses çaları desteklemiyor.
  </audio>

  <!-- Konfeti için canvas -->
  <canvas id="confetti-canvas"></canvas>

<script>
  const countdownElement = document.getElementById('countdown');
  const messageElement = document.getElementById('message');
  const music = document.getElementById('music');
  const playBtn = document.getElementById('play-music-btn');
  const startQuizBtn = document.getElementById('start-quiz-btn');
  const carousel = document.getElementById('carousel');
  const quizContainer = document.getElementById('quiz-container');
  const questionContainer = document.getElementById('question-container');
  const nextQuestionBtn = document.getElementById('next-question-btn');
  const quizResult = document.getElementById('quiz-result');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  // Hedef tarih: 29 Mayıs 00:00 (bugün 29 Mayıs veya sonrası ise gelecek yıl)
  const hedefTarih = new Date();
  if (hedefTarih.getMonth() > 4 || (hedefTarih.getMonth() === 4 && hedefTarih.getDate() > 29)) {
    hedefTarih.setFullYear(hedefTarih.getFullYear() + 1);
  }
  hedefTarih.setMonth(4);
  hedefTarih.setDate(29);
  hedefTarih.setHours(0, 0, 0, 0);

  // Geri sayım fonksiyonu
  function updateCountdown() {
    const now = new Date();
    const fark = hedefTarih - now;

    if (fark <= 0) {
      countdownElement.style.display = "none";
      messageElement.style.display = "block";
      startConfetti();
      return;
    }

    const gun = Math.floor(fark / (1000 * 60 * 60 * 24));
    const saat = Math.floor((fark / (1000 * 60 * 60)) % 24);
    const dakika = Math.floor((fark / (1000 * 60)) % 60);
    const saniye = Math.floor((fark / 1000) % 60);

    countdownElement.textContent = 
      `📅 ${gun} gün, 🕒 ${saat} saat, ⏰ ${dakika} dakika, ⏳ ${saniye} saniye`;
  }

  // Quiz soruları
  const questions = [
    {
      question: "Ece şuanda karatede hangi kuşakta?",
      options: ["A) Kahverengi", "B) Siyah", "C) Mavi", "D) Yeşil"],
      answer: "A) Kahverengi"
    },
    {
      question: "Ece şuanda hangi okulda okuyor?",
      options: ["A) İzmir Fen Lisesi", "B) Bornova Anadolu Lisesi", "C) Menemen Atatürk Anadolu Lisesi", "D) ODTÜ"],
      answer: "C) Menemen Atatürk Anadolu Lisesi"
    },
    {
      question: "Ecenin en sevdiği hayvan?",
      options: ["A) Kedi", "B) Köpek", "C) Tavşan", "D) Kuş"],
      answer: "A) Kedi"
    },
    {
      question: "Ece şuan kaçıncı sınıf?",
      options: ["A) 10", "B) 11", "C) 12", "D) 9"],
      answer: "B) 11"
    },
    {
      question: "Ecenin sınıf şubesi nedir?",
      options: ["A) 11-A", "B) 11-B", "C) 11-C", "D) 11-İ"],
      answer: "D) 11-İ"
    },
    {
      question: "Ecenin okuduğu bölüm nedir?",
      options: ["A) Matematik", "B) Dil", "C) Fen", "D) Sosyal Bilgiler"],
      answer: "B) Dil"
    },
    {
      question: "Ecenin okul numarası kaçtır?",
      options: ["A) 1028", "B) 1025", "C) 1088", "D) 1005"],
      answer: "B) 1025"
    },
    {
      question: "Ecenin doğduğu yıl kaçtır?",
      options: ["A) 2007", "B) 2008", "C) 2009", "D) 2010"],
      answer: "B) 2008"
    },
    {
      question: "Ece hangi ayda doğmuştur?",
      options: ["A) Nisan", "B) Mayıs", "C) Haziran", "D) Temmuz"],
      answer: "B) Mayıs"
    },
    {
      question: "Ecenin en sevdiği arkadaşının ismi nedir?",
      options: ["A) Ali", "B) Tuna", "C) Ayşe", "D) Mehmet"],
      answer: "B) Tuna"
    }
  ];

  let currentQuestionIndex = 0;
  let score = 0;

  // Soruyu göster
  function showQuestion() {
    const currentQuestion = questions[currentQuestionIndex];
    questionContainer.innerHTML = `
      <div class="question">${currentQuestion.question}</div>
      ${currentQuestion.options.map(option => `<div class="option"><input type="radio" name="question${currentQuestionIndex}" value="${option}"> ${option}</div>`).join('')}
    `;
  }

  // Quiz'i başlat
  startQuizBtn.addEventListener('click', () => {
    quizContainer.style.display = 'block';
    startQuizBtn.style.display = 'none';
    showQuestion();
  });

  // İleri butonuna tıklandığında
  nextQuestionBtn.addEventListener('click', () => {
    const selectedOption = document.querySelector(`input[name="question${currentQuestionIndex}"]:checked`);
    if (selectedOption) {
      if (selectedOption.value === questions[currentQuestionIndex].answer) {
        score++;
      }
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    } else {
      alert('Lütfen bir seçenek seçin.');
    }
  });

  // Sonucu göster
  function showResult() {
    quizContainer.style.display = 'none';
    if (score === questions.length) {
      quizResult.innerHTML = `Quiz tamamlandı! Puanınız: ${score} / ${questions.length}. 🎇 Havai fişekler! 🎇`;
      startFireworks();
    } else {
      quizResult.innerHTML = `Quiz tamamlandı! Puanınız: ${score} / ${questions.length}`;
    }
  }

  // Havai fişek animasyonu
  function startFireworks() {
    // Havai fişek animasyonu için burada kod yazabilirsiniz.
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function createFirework(x, y) {
      const particles = 100;
      for (let i = 0; i < particles; i++) {
        const angle = Math.random() * 2 * Math.PI;
        const speed = Math.random() * 3 + 2;
        const particle = {
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 2,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`
        };
        fireworks.push(particle);
      }
    }

    const fireworks = [];
    createFirework(canvas.width / 2, canvas.height / 2);

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fireworks.forEach((firework, index) => {
        firework.x += firework.vx;
        firework.y += firework.vy;
        firework.vy += 0.05; // Yer çekimi
        ctx.fillStyle = firework.color;
        ctx.beginPath();
        ctx.arc(firework.x, firework.y, firework.size, 0, Math.PI * 2);
        ctx.fill();

        // Parçacıkların ekrandan çıkması durumunda sil
        if (firework.y > canvas.height) {
          fireworks.splice(index, 1);
        }
      });

      requestAnimationFrame(animate);
    }

    animate();
  }

  // Müziği başlat
  playBtn.addEventListener('click', () => {
    music.play();
    countdownElement.style.display = "block";
    startQuizBtn.style.display = "block";
    playBtn.style.display = "none";
    setInterval(updateCountdown, 1000);
  });

  // Carousel işlevselliği
  let currentSlide = 0;
  const slides = document.querySelectorAll('.carousel-slide');

  function showSlide(index) {
    slides.forEach((slide, i) => {
      slide.classList.remove('active');
      if (i === index) {
        slide.classList.add('active');
      }
    });
  }

  nextBtn.addEventListener('click', () => {
    currentSlide = (currentSlide + 1) % slides.length;
    showSlide(currentSlide);
  });

  prevBtn.addEventListener('click', () => {
    currentSlide = (currentSlide - 1 + slides.length) % slides.length;
    showSlide(currentSlide);
  });

  // Sayfa yüklendiğinde geri sayımı başlat
  updateCountdown();
</script>
</body>
</html>
