                        sans: ['Inter', 'sans-serif'],
                        cursive: ['Dancing Script', 'cursive']
                    },
                    colors: {
                        'primary-blue': '#4A90E2',
                        'secondary-pink': '#FF69B4',
                        'bg-dark': '#121212',
                        'card-dark': '#1E1E1E',
                        'text-light': '#E0E0E0',
                        'message-pink': '#FFC0CB',
                    },
                    boxShadow: {
                        'pink-glow': '0 0 15px rgba(255, 105, 180, 0.7)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 1s ease-in-out',
                        'slide-up': 'slideUp 0.7s ease-out forwards',
                        'pulse-grow': 'pulseGrow 1.5s ease-in-out infinite',
                        'light-up': 'lightUp 0.5s ease-out forwards',
                        'message-appear': 'messageAppear 1s ease-in-out 1s forwards',
                        'message-slide-in': 'messageSlideIn 1s ease-in-out 0.8s forwards',
                        'blinking-cursor': 'blink 1s step-end infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(50px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        pulseGrow: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.05)' }
                        },
                        lightUp: {
                            '0%': { 'background-color': '#FF69B4' },
                            '100%': { 'background-color': '#FFD1DC' }
                        },
                        messageAppear: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' }
                        },
                        messageSlideIn: {
                            '0%': { transform: 'translateY(100%)', opacity: 0 },
                            '100%': { transform: 'translateY(0)', opacity: 1 }
                        },
                        blink: {
                            'from, to': { 'opacity': 1 },
                            '50%': { 'opacity': 0 },
                        }
                    }
                }
            }
        }

        body {

        .photo-card:hover {
            transform: scale(1.05);

        .image-container {
            position: relative;

            border-radius: 12px;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.2);
            transition: box-shadow 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .image-container:hover {
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.7);

        }
        
        .photo-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);

            font-size: 0.875rem;

        }
        .image-container:hover .photo-caption {
            opacity: 1;
        }

        /* Mesaj butonu animasyonu */
        .message-button-transition {
            transition: all 0.5s ease-in-out;
        }
        .message-box-transition {
            transition: all 1s ease-in-out;
        }

        }
        .comment-form {
            background-color: #1a1a1a;

        // --- Core Functions ---
        
        function resizeCanvas() {
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        }

        function createHeart() {
            const size = Math.random() * 20 + 20; 
            const color = heartColors[Math.floor(Math.random() * heartColors.length)];
            hearts.push({
                x: Math.random() * canvas.width,
                y: -size, 
                size: size,
                speed: Math.random() * 0.5 + 0.5,
                color: color,
                opacity: 0.1,
            });
        }
        
        function drawHearts() {
            if (ctx) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < hearts.length; i++) {
                    const h = hearts[i];
                    ctx.save();
                    ctx.translate(h.x, h.y);
                    
                    ctx.beginPath();
                    ctx.moveTo(0, h.size * 0.4);
                    ctx.bezierCurveTo(0, -h.size * 0.2, h.size * 0.6, h.size * 0.4, 0, h.size);
                    ctx.bezierCurveTo(-h.size * 0.6, h.size * 0.4, 0, -h.size * 0.2, 0, h.size * 0.4);
                    
                    ctx.fillStyle = h.color;
                    ctx.globalAlpha = h.opacity;
                    ctx.fill();
                    ctx.restore();
                }
            }
        }
        
        function updateHearts() {
            for (let i = 0; i < hearts.length; i++) {
                hearts[i].y += hearts[i].speed;
            }
            hearts = hearts.filter(h => h.y < canvas.height + 20);

            if (hearts.length < heartCount) {
                createHeart();
            }
        }
        
        function animate() {
            updateHearts();
            drawHearts();
            requestAnimationFrame(animate);
        }

        function renderPage(pageName) {
            contentArea.classList.add('opacity-0');
            setTimeout(() => {
                contentArea.innerHTML = '';
                if (pageName === 'home') {
                    contentArea.innerHTML = homePageContent;
                    updateCountdown(); 
                    startCountdown();
                    setActiveNav('home');
                } else if (pageName === 'memories') {
                    contentArea.innerHTML = memoriesPageContent;
                    setActiveNav('memories');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else if (pageName === 'art') {
                    contentArea.innerHTML = artGalleryContent;
                    setActiveNav('art');

                } else if (pageName === 'message') {

                    setActiveNav('guestbook');
                    attachGuestbookListeners();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
                contentArea.classList.remove('opacity-0');
            }, 500);
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = birthdayDate - now;

            if (distance > 0) {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                const daysEl = document.getElementById('days');
                const hoursEl = document.getElementById('hours');
                const minutesEl = document.getElementById('minutes');
                const secondsEl = document.getElementById('seconds');
                
                if(daysEl) daysEl.textContent = days;
                if(hoursEl) hoursEl.textContent = hours;
                if(minutesEl) minutesEl.textContent = minutes;
                if(secondsEl) secondsEl.textContent = seconds;
            } else {
                const countdownTextEl = document.getElementById('countdown-text');
                if(countdownTextEl) countdownTextEl.textContent = "Doğum Günün Kutlu Olsun!";
            }
        }
        
        function startCountdown() {
            setInterval(() => {
                updateCountdown();
            }, 1000);
        }

        const messages = [

            "Sen, bu dünyadaki en harika, en tatlı, en içten ve en özel insanlardan birisin. Her anınla, her gülüşünle ve her bakışınla etrafına ışık saçıyosun.",

            "Bu siteyi yapma ve oluşturma amacım, sadece sana özel anılarımızı ve sana olan sevgimi ölümsüzleştirmek için bir hediye. Lütfen her sayfanın tadını çıkar ve bu küçük sürprizin sana ne kadar değer verdiğimi hatırlatmasını dile seni çok seviyorum iyiki varsın.",
            "Sevgilerimle, Tuna."

        const typingDelay = 50; 
        const paragraphDelay = 1500; 
        
        async function typeMessageContent() {
            const allMessagesContainer = document.getElementById('all-messages-container');
            if (!allMessagesContainer) return;
            allMessagesContainer.innerHTML = ''; 

            for (let i = 0; i < messages.length; i++) {
                const p = document.createElement('p');
                p.classList.add('font-light', 'text-base', 'md:text-lg', 'mb-4'); 
                allMessagesContainer.appendChild(p);

                for (let j = 0; j < messages[i].length; j++) {
                    p.textContent += messages[i][j];
                    await new Promise(resolve => setTimeout(resolve, typingDelay));
                }

                if (i === messages.length - 1) {
                    const cursor = document.createElement('span');
                    cursor.id = 'cursor';
                    cursor.classList.add('text-sm', 'md:text-md', 'text-secondary-pink', 'inline-block', 'w-2', 'h-4', 'bg-secondary-pink', 'animate-blinking-cursor', 'align-middle');
                    allMessagesContainer.appendChild(cursor);
                } else {
                    await new Promise(resolve => setTimeout(resolve, paragraphDelay));
                }
            }
        }

        function attachMessageButtonListener() {
            const showMessageBtn = document.getElementById('show-message-btn');
            const allMessagesContainer = document.getElementById('all-messages-container');
            if (showMessageBtn) {
                showMessageBtn.addEventListener('click', () => {
                    showMessageBtn.classList.add('opacity-0', 'scale-90');
                    setTimeout(() => {
                        showMessageBtn.classList.add('hidden');
                        allMessagesContainer.classList.remove('hidden');
                        typeMessageContent(); 
                    }, 500); 
                });
            }
        }

        function attachGuestbookListeners() {
            const commentForm = document.getElementById('commentForm');
            const commentsList = document.getElementById('commentsList');
            const submitBtn = document.getElementById('submit-comment-btn');

            if (!commentForm || !commentsList || !submitBtn) {
                return;
            }
            
            // Yorumları localStorage'dan çek ve ekrana bas
            function displayComments() {
                commentsList.innerHTML = '';
                const comments = JSON.parse(localStorage.getItem('guestbookComments') || '[]');
                
                // Yorumları en yenisi en üstte olacak şekilde sırala
                comments.reverse();
                
                comments.forEach(comment => {
                    const commentElement = document.createElement('div');
                    commentElement.classList.add('comment-card', 'animate-fade-in');
                    
                    const date = new Date(comment.timestamp);
                    const formattedDate = date.toLocaleDateString('tr-TR') + ' ' + date.toLocaleTimeString('tr-TR');

                    commentElement.innerHTML = `
                        <p class="font-bold text-lg text-primary-blue">${comment.name}</p>
                        <p class="mt-2 text-text-light text-md">${comment.text}</p>
                        <p class="text-xs text-gray-500 mt-2">${formattedDate}</p>
                    `;
                    commentsList.appendChild(commentElement);
                });
            }

            // Sayfa yüklendiğinde yorumları göster
            displayComments();

            // Yorum gönderme butonuna tıklama olayı
            submitBtn.addEventListener('click', () => {
                const commentName = document.getElementById('commentName').value.trim();
                const commentText = document.getElementById('commentText').value.trim();
    
                if (!commentName || !commentText) {
                    return;
                }

                // Yorumu bir obje olarak hazırla
                const newComment = {
                    name: commentName,
                    text: commentText,
                    timestamp: new Date().toISOString() // ISO formatında tarih ve saat
                };

                // Eski yorumları localStorage'dan çek
                const comments = JSON.parse(localStorage.getItem('guestbookComments') || '[]');
                
                // Yeni yorumu listeye ekle
                comments.push(newComment);
                
                // Güncellenmiş listeyi localStorage'a geri kaydet
                localStorage.setItem('guestbookComments', JSON.stringify(comments));

                // Formu temizle
                commentForm.reset();

                // Yorumları tekrar yükle
                displayComments();
            });
        }
        
        // --- Password Game Logic ---
        function generateSequence() {
            const newSequence = [];
            for (let i = 0; i < sequenceLength; i++) {
                newSequence.push(Math.floor(Math.random() * heartButtonCount));
            }
            return newSequence;
        }

        function playSequence() {
            isPlaying = true;
            startButton.disabled = true;
            startButton.classList.add('opacity-50', 'cursor-not-allowed');

            let i = 0;
            const hearts = document.querySelectorAll('#heart-grid .heart-icon-btn');
            const interval = setInterval(() => {
                if (i < sequence.length) {
                    const heart = hearts[sequence[i]];
                    heart.classList.add('lighted-heart');
                    setTimeout(() => {
                        heart.classList.remove('lighted-heart');
                    }, 500);
                    i++;
                } else {
                    clearInterval(interval);
                    isPlaying = false;
                    startButton.disabled = false;
                    startButton.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 700);
        }

        function checkSequence() {
            if (userSequence.length !== sequence.length) return false;
            for (let i = 0; i < sequence.length; i++) {
                if (userSequence[i] !== sequence[i]) {
                    return false;
                }
            }
            return true;
        }
        
        function createHeartButtons() {
            if (!heartGrid) {
                console.error("Hata: 'heart-grid' elementi bulunamadı. Butonlar oluşturulamıyor.");
                return;
            }
            
            heartGrid.innerHTML = ''; 
            for(let i = 0; i < heartButtonCount; i++) {
                const button = document.createElement('button');
                button.classList.add('heart-icon-btn', 'aspect-square', 'bg-gray-700', 'rounded-full', 'flex', 'items-center', 'justify-center', 'text-2xl', 'text-secondary-pink', 'shadow-md', 'hover:bg-gray-600', 'transition-colors', 'duration-300');
                button.dataset.index = i;
                button.innerHTML = `&hearts;`; 

                button.addEventListener('click', (event) => {
                    if (isPlaying) return;
                    const index = parseInt(event.currentTarget.dataset.index);
                    userSequence.push(index);

                    const clickedHeart = event.currentTarget;
                    clickedHeart.classList.add('lighted-heart');
                    setTimeout(() => {
                        clickedHeart.classList.remove('lighted-heart');
                    }, 500);
                    
                    if (userSequence.length === sequence.length) {
                        if (checkSequence()) {
                            passwordPage.classList.add('password-page-hidden');
                            setTimeout(() => {
                                passwordPage.classList.add('hidden');
                                appContainer.classList.remove('hidden');
                                renderPage('home');
                            }, 500);
                        } else {
                            feedbackMessage.classList.remove('hidden');
                            userSequence = [];
                            setTimeout(() => {
                                feedbackMessage.classList.add('hidden');
                            }, 2000);
                            setTimeout(() => {
                                sequence = generateSequence();
                                playSequence();
                            }, 2500);
                        }
                    }
                });
                heartGrid.appendChild(button);
            }
        }
        
        // --- Event Listeners ---
        if (startButton) {
            startButton.addEventListener('click', () => {
                userSequence = [];
                sequence = generateSequence();
                playSequence();
            });
        }
        
        if (navHomeBtn) navHomeBtn.addEventListener('click', () => renderPage('home'));
        if (navMemoriesBtn) navMemoriesBtn.addEventListener('click', () => renderPage('memories'));
        if (navArtBtn) navArtBtn.addEventListener('click', () => renderPage('art'));
        if (navMessageBtn) navMessageBtn.addEventListener('click', () => renderPage('message'));
        if (navGuestbookBtn) navGuestbookBtn.addEventListener('click', () => renderPage('guestbook'));

        if (navHomeDesktopBtn) navHomeDesktopBtn.addEventListener('click', () => renderPage('home'));
        if (navMemoriesDesktopBtn) navMemoriesDesktopBtn.addEventListener('click', () => renderPage('memories'));
        if (navArtDesktopBtn) navArtDesktopBtn.addEventListener('click', () => renderPage('art'));
        if (navMessageDesktopBtn) navMessageDesktopBtn.addEventListener('click', () => renderPage('message'));
        if (navGuestbookDesktopBtn) navGuestbookDesktopBtn.addEventListener('click', () => renderPage('guestbook'));
        
        // DOM içeriği yüklendikten sonra her şeyi başlat
        document.addEventListener('DOMContentLoaded', () => {
            createHeartButtons();
            resizeCanvas();
            animate();
            window.addEventListener('resize', resizeCanvas);
        });

    </script>
