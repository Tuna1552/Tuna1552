<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>29 Mayıs 2026 - Sürpriz</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body, html {
      height: 100%;
      background: linear-gradient(135deg, #ffe6f0, #e0f7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #password-screen {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 20px;
      animation: fadeIn 1s ease-in-out;
    }

    .password-box {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      text-align: center;
      animation: popIn 1s ease-in-out;
      max-width: 90%;
      width: 400px;
    }

    .password-box h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 1.5em;
    }

    .password-box input {
      padding: 12px 16px;
      width: 100%;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
      transition: all 0.3s;
    }

    .password-box input:focus {
      outline: none;
      border-color: #ff66a3;
      box-shadow: 0 0 5px #ff99c2;
    }

    .password-box button {
      padding: 12px 24px;
      background-color: #ff66a3;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      transition: background-color 0.3s, transform 0.2s;
    }

    .password-box button:hover {
      background-color: #ff3385;
      transform: scale(1.05);
    }

    .error {
      color: red;
      margin-top: 10px;
      font-size: 0.9em;
    }

    #main-content {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #333;
      padding: 20px;
      height: 100%;
      width: 100%;
      overflow-y: auto;
    }

    .countdown {
      font-size: 2em;
      font-weight: 600;
      color: #cc0066;
      margin-top: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0,0,0,0.1);
      animation: popIn 1s ease;
      max-width: 90%;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: 40px auto;
      width: 100%;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes popIn {
      from {opacity: 0; transform: scale(0.5);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>

  <!-- Şifre Giriş Ekranı -->
  <div id="password-screen">
    <div class="password-box">
      <h2>Şifreyi Gir</h2>
      <input type="password" id="passwordInput" placeholder="Şifre" onkeydown="handleKey(event)">
      <br>
      <button onclick="checkPassword()">Giriş</button>
      <div class="error" id="errorText"></div>
    </div>
  </div>

  <!-- Ana Sayfa İçeriği -->
  <div id="main-content">
    <h1>29 Mayıs 2026'ya Kalan Süre</h1>
    <div class="countdown" id="countdown"></div>

    <h2 style="margin-top: 60px; color: #cc0066;">Fotoğraf Galerisi</h2>
    <div class="gallery">
      <img src="https://i.imgur.com/w38ApFX.jpeg" alt="Fotoğraf 1">
      <img src="https://i.imgur.com/ahJTXWO.jpeg" alt="Fotoğraf 2">
      <img src="https://i.imgur.com/8MvwSQp.jpeg" alt="Fotoğraf 3">
      <img src="https://i.imgur.com/x39dCoM.jpeg" alt="Fotoğraf 4">
      <img src="https://i.imgur.com/DUhcnSQ.jpeg" alt="Fotoğraf 5">
      <img src="https://i.imgur.com/lcQuFtH.jpeg" alt="Fotoğraf 6">
    </div>
  </div>

  <script>
    const passwordScreen = document.getElementById('password-screen');
    const mainContent = document.getElementById('main-content');
    const errorText = document.getElementById('errorText');

    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      if (input === "2008") {
        passwordScreen.style.display = 'none';
        mainContent.style.display = 'flex';
        errorText.innerText = "";
      } else {
        errorText.innerText = "Hatalı şifre! Lütfen tekrar deneyin.";
      }
    }

    function handleKey(e) {
      if (e.key === "Enter") {
        checkPassword();
      }
    }

    // Geri Sayım
    const countdown = document.getElementById("countdown");
    const targetDate = new Date("May 29, 2026 00:00:00").getTime();

    setInterval(function() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdown.innerHTML = `${days} gün ${hours} saat ${minutes} dakika ${seconds} saniye`;
    }, 1000);
  </script>
</body>
</html>
