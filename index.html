                                Sen hayatıma girdiğinden beri her şey daha anlamlı, daha güzel ve daha renkli. Sen, bu dünyadaki en harika, en tatlı, en içten ve en özel insanlardan birisin. Her anınla, her gülüşünle ve her bakışınla etrafına ışık saçıyorsun.
                            </p>
                            <p class="text-lg md:text-xl font-light text-text-light leading-relaxed">
                                Seninle vakit geçirmek, bana en büyük mutluluğu veriyor. Paylaştığımız her an, her espri, her dertleşme benim için çok değerli. Senin gibi bir dostum olduğu için kendimi çok şanslı hissediyorum.
                            </p>
                        </div>
                        <!-- Sağ Sütun -->
                        <div class="flex-1">
                            <p class="text-lg md:text-xl font-light text-text-light leading-relaxed mb-4">
                                İyiki doğdun, iyiki varsın Ece'm. Yüzünden gülücükler, kalbinden sevgi eksik olmasın. Hayatının geri kalanında tüm hayallerinin gerçekleşmesini ve her zaman kalbinin istediği yolda yürümeni dilerim.
                            </p>
                            <p class="text-lg md:text-xl font-light text-text-light leading-relaxed mb-8">
                                Bu site, sadece sana özel anılarımızı ve sana olan sevgimi ölümsüzleştirmek için bir hediye. Lütfen her sayfanın tadını çıkar ve bu küçük sürprizin sana ne kadar değer verdiğimi hatırlatmasını dile.
                            </p>
                            <div class="flex justify-end">
                                <span class="text-right text-sm italic text-gray-400">Tüm sevgilerimle...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // --- Fonksiyonlar ---
        
        // Canvas ve Kalp Animasyonu
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createHeart() {
            const size = Math.random() * 20 + 20; 
            const color = heartColors[Math.floor(Math.random() * heartColors.length)];
            hearts.push({
                x: Math.random() * canvas.width,
                y: -size, 
                size: size,
                speed: Math.random() * 0.5 + 0.5,
                color: color,
                opacity: 0.1,
            });
        }
        
        function drawHearts() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 105, 180, 0.1)"; 
            
            for (let i = 0; i < hearts.length; i++) {
                const h = hearts[i];
                ctx.save();
                ctx.translate(h.x, h.y);
                
                ctx.beginPath();
                ctx.moveTo(0, h.size * 0.4);
                ctx.bezierCurveTo(0, -h.size * 0.2, h.size * 0.6, h.size * 0.4, 0, h.size);
                ctx.bezierCurveTo(-h.size * 0.6, h.size * 0.4, 0, -h.size * 0.2, 0, h.size * 0.4);
                
                ctx.fillStyle = h.color;
                ctx.globalAlpha = h.opacity;
                ctx.fill();
                ctx.restore();
            }
        }
        
        function updateHearts() {
            for (let i = 0; i < hearts.length; i++) {
                hearts[i].y += hearts[i].speed;
            }
            hearts = hearts.filter(h => h.y < canvas.height + 20);

            if (hearts.length < heartCount) {
                createHeart();
            }
        }
        
        function animate() {
            updateHearts();
            drawHearts();
            requestAnimationFrame(animate);
        }

        // Sayfa içeriğini render eden fonksiyon
        function renderPage(pageName) {
            contentArea.classList.add('opacity-0');
            setTimeout(() => {
                contentArea.innerHTML = '';
                if (pageName === 'home') {
                    contentArea.innerHTML = homePageContent;
                    startCountdown();
                    setActiveNav('home');
                } else if (pageName === 'memories') {
                    contentArea.innerHTML = memoriesPageContent;
                    setActiveNav('memories');
                } else if (pageName === 'art') {
                    contentArea.innerHTML = artGalleryContent;
                    setActiveNav('art');
                } else if (pageName === 'message') {
                    contentArea.innerHTML = messagePageContent;
                    setActiveNav('message');
                }
                contentArea.classList.remove('opacity-0');
            }, 500);
        }

        // Aktif navigasyon butonunu belirleyen fonksiyon
        function setActiveNav(pageName) {
            // Mobil Navigasyon
            navHomeBtn.classList.remove('text-secondary-pink');
            navMemoriesBtn.classList.remove('text-secondary-pink');
            navArtBtn.classList.remove('text-secondary-pink');
            navMessageBtn.classList.remove('text-secondary-pink');
            navHomeBtn.classList.add('text-gray-400');
            navMemoriesBtn.classList.add('text-gray-400');
            navArtBtn.classList.add('text-gray-400');
            navMessageBtn.classList.add('text-gray-400');
            if (pageName === 'home') {
                navHomeBtn.classList.replace('text-gray-400', 'text-secondary-pink');
            } else if (pageName === 'memories') {
                navMemoriesBtn.classList.replace('text-gray-400', 'text-secondary-pink');
            } else if (pageName === 'art') {
                navArtBtn.classList.replace('text-gray-400', 'text-secondary-pink');
            } else if (pageName === 'message') {
                 navMessageBtn.classList.replace('text-gray-400', 'text-secondary-pink');
            }

            // Masaüstü Navigasyon
            navHomeDesktopBtn.classList.remove('bg-primary-blue', 'shadow-lg');
            navMemoriesDesktopBtn.classList.remove('bg-primary-blue', 'shadow-lg');
            navArtDesktopBtn.classList.remove('bg-primary-blue', 'shadow-lg');
            navMessageDesktopBtn.classList.remove('bg-primary-blue', 'shadow-lg');
            navHomeDesktopBtn.classList.add('hover:bg-gray-700');
            navMemoriesDesktopBtn.classList.add('hover:bg-gray-700');
            navArtDesktopBtn.classList.add('hover:bg-gray-700');
            navMessageDesktopBtn.classList.add('hover:bg-gray-700');
            if (pageName === 'home') {
                navHomeDesktopBtn.classList.add('bg-primary-blue', 'shadow-lg');
                navHomeDesktopBtn.classList.remove('hover:bg-gray-700');
            } else if (pageName === 'memories') {
                navMemoriesDesktopBtn.classList.add('bg-primary-blue', 'shadow-lg');
                navMemoriesDesktopBtn.classList.remove('hover:bg-gray-700');
            } else if (pageName === 'art') {
                navArtDesktopBtn.classList.add('bg-primary-blue', 'shadow-lg');
                navArtDesktopBtn.classList.remove('hover:bg-gray-700');
            } else if (pageName === 'message') {
                navMessageDesktopBtn.classList.add('bg-primary-blue', 'shadow-lg');
                navMessageDesktopBtn.classList.remove('hover:bg-gray-700');
            }
        }

        // Geri sayım mantığını yöneten fonksiyon
        function startCountdown() {
            const countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = birthdayDate - now;

                if (distance > 0) {
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    const daysEl = document.getElementById('days');
                    const hoursEl = document.getElementById('hours');
                    const minutesEl = document.getElementById('minutes');
                    const secondsEl = document.getElementById('seconds');
                    
                    if(daysEl) daysEl.textContent = days;
                    if(hoursEl) hoursEl.textContent = hours;
                    if(minutesEl) minutesEl.textContent = minutes;
                    if(secondsEl) secondsEl.textContent = seconds;
                } else {
                    clearInterval(countdownInterval);
                    const countdownTextEl = document.getElementById('countdown-text');
                    if(countdownTextEl) countdownTextEl.textContent = "Doğum Günün Kutlu Olsun!";
                }
            }, 1000);
        }

        // --- Şifre Oyunu Mantığı ---
        function generateSequence() {
            const newSequence = [];
            for (let i = 0; i < sequenceLength; i++) {
                newSequence.push(Math.floor(Math.random() * heartButtonCount));
            }
            return newSequence;
        }

        function playSequence() {
            isPlaying = true;
            let i = 0;
            const hearts = heartGrid.querySelectorAll('.heart-icon-btn');
            const interval = setInterval(() => {
                if (i < sequence.length) {
                    const heart = hearts[sequence[i]];
                    heart.classList.add('lighted-heart');
                    setTimeout(() => {
                        heart.classList.remove('lighted-heart');
                    }, 500);
                    i++;
                } else {
                    clearInterval(interval);
                    isPlaying = false;
                    startButton.disabled = false;
                    startButton.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 700);
        }

        function checkSequence() {
            if (userSequence.length !== sequence.length) return false;
            for (let i = 0; i < sequence.length; i++) {
                if (userSequence[i] !== sequence[i]) {
                    return false;
                }
            }
            return true;
        }
        
        // Şifre ekranı için kalp butonları oluşturur
        function createHeartButtons() {
            heartGrid.innerHTML = '';
            for(let i = 0; i < heartButtonCount; i++) {
                const button = document.createElement('button');
                button.classList.add('heart-icon-btn', 'aspect-square', 'bg-gray-700', 'rounded-full', 'flex', 'items-center', 'justify-center', 'text-2xl', 'text-secondary-pink', 'shadow-md', 'hover:bg-gray-600', 'transition-colors', 'duration-300');
                button.dataset.index = i;
                button.innerHTML = `&hearts;`;
                button.addEventListener('click', (event) => {
                    if (isPlaying) return;
                    const index = parseInt(event.target.dataset.index);
                    userSequence.push(index);
                    event.target.classList.add('lighted-heart');
                    setTimeout(() => {
                        event.target.classList.remove('lighted-heart');
                    }, 500);
                    
                    if (userSequence.length === sequence.length) {
                        if (checkSequence()) {
                            passwordPage.classList.add('password-page-hidden');
                            setTimeout(() => {
                                passwordPage.classList.add('hidden');
                                appContainer.classList.remove('hidden');
                                renderPage('home');
                            }, 500);
                        } else {
                            feedbackMessage.classList.remove('opacity-0');
                            userSequence = [];
                            setTimeout(() => {
                                feedbackMessage.classList.add('opacity-0');
                            }, 2000);
                            setTimeout(() => {
                                sequence = generateSequence();
                                playSequence();
                            }, 2500);
                        }
                    }
                });
                heartGrid.appendChild(button);
            }
        }

        // --- Olay Dinleyicileri (Event Listeners) ---

        // Sayfa yüklendiğinde kalp butonlarını oluştur ve canvas animasyonunu başlat
        window.addEventListener('load', () => {
             createHeartButtons();
             resizeCanvas();
             animate();
        });
        
        window.addEventListener('resize', resizeCanvas);

        // Şifre oyununu başlat
        startButton.addEventListener('click', () => {
            startButton.disabled = true;
            startButton.classList.add('opacity-50', 'cursor-not-allowed');
            userSequence = [];
            sequence = generateSequence();
            playSequence();
        });

        // Navigasyon butonları
        navHomeBtn.addEventListener('click', () => renderPage('home'));
        navMemoriesBtn.addEventListener('click', () => renderPage('memories'));
        navArtBtn.addEventListener('click', () => renderPage('art'));
        navMessageBtn.addEventListener('click', () => renderPage('message'));

        navHomeDesktopBtn.addEventListener('click', () => renderPage('home'));
        navMemoriesDesktopBtn.addEventListener('click', () => renderPage('memories'));
        navArtDesktopBtn.addEventListener('click', () => renderPage('art'));
        navMessageDesktopBtn.addEventListener('click', () => renderPage('message'));
    </script>
</body>
