<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>🎉 Ece'nin Doğum Günü 🎉</title>
  <style>
    /* Genel stil */
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      position: relative;
      text-align: center;
    }
    h2 {
      margin-bottom: 8px;
      color: #ff007f;
      font-size: 1.5em; /* Başlık boyutu büyütüldü */
    }
    .password-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      font-size: 1.5em; /* Genel yazı boyutu büyütüldü */
    }
    .input-container {
      display: flex;
      gap: 10px;
    }
    .digit-box {
      width: 70px; /* Genişlik artırıldı */
      height: 70px; /* Yükseklik artırıldı */
      font-size: 48px; /* Yazı boyutu artırıldı */
      text-align: center;
      border-radius: 10px;
      border: 2px solid #aaa;
      background: #f9f9f9;
      color: #333;
      transition: border-color 0.3s;
    }
    .digit-box:focus {
      outline: none;
      border-color: #007BFF;
    }
    .buttons {
      display: flex;
      gap: 15px;
    }
    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .cancel {
      background-color: #999;
      color: white;
    }
    .submit {
      background-color: #007BFF;
      color: white;
    }
    .error {
      color: #ff4d4d;
      margin-top: 10px;
    }
    /* Geri Sayım ve Mesaj */
    #countdown {
      display: none;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 20px 40px;
      font-weight: 700;
      font-size: 2em;
      color: #ff007f;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
      margin-top: 10px;
    }
    #message {
      font-size: 2.2em;
      margin-top: 2em;
      color: #ff1493;
      text-shadow: 0 0 8px #ff69b4;
      display: none;
    }
    /* Müziği Çal Butonu */
    #play-music-btn {
      padding: 15px 40px;
      font-size: 1.5em;
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff1493, #ff69b4);
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 20, 147, 0.7);
      transition: background 0.3s ease, transform 0.3s ease;
      margin-top: 20px;
      display: none; /* Başlangıçta gizli */
    }
    #play-music-btn:hover {
      background: linear-gradient(45deg, #ff69b4, #ff1493);
      transform: scale(1.05);
    }
    #play-music-btn:active {
      transform: scale(0.95);
    }
    /* Carousel container */
    .carousel {
      position: relative;
      margin: 40px auto 0;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      background: #fff;
      display: none; /* Başlangıçta gizli */
      max-width: 90vw;
    }
    /* Slides */
    .carousel-slide {
      display: none;
      border-radius: 20px;
      max-width: 100%;
      height: auto;
      transition: opacity 0.7s ease-in-out;
      position: absolute;
      top: 0;
      left: 0;
    }
    .carousel-slide.active {
      display: block;
      position: relative;
      animation: fadeIn 1s ease forwards;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
    /* Navigation buttons */
    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      font-size: 2em;
      color: #ff007f;
      box-shadow: 0 0 15px rgba(255,0,127,0.7);
      transition: background 0.3s ease;
    }
    .carousel-button:hover {
      background: #ff007f;
      color: #fff;
    }
    .carousel-button.prev {
      left: 15px;
    }
    .carousel-button.next {
      right: 15px;
    }
    /* Canvas konfeti z-index */
    canvas#confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 950;
      width: 100vw;
      height: 100vh;
    }
    /* Ece'nin Okul Numarası stil */
    .info-text {
      font-size: 1.2em; /* Büyütüldü */
      color: #333; /* Daha okunabilir bir renk */
    }
  </style>
</head>
<body>

  <div class="password-container" id="password-section">
    <h2>Şifreyi giriniz</h2>
    <div class="input-container">
      <input type="password" maxlength="1" class="digit-box" id="digit1" onfocus="this.setAttribute('inputmode', 'numeric')" oninput="moveFocus(this, 1)" onkeypress="return isNumberKey(event)">
      <input type="password" maxlength="1" class="digit-box" id="digit2" onfocus="this.setAttribute('inputmode', 'numeric')" oninput="moveFocus(this, 2)" onkeypress="return isNumberKey(event)">
      <input type="password" maxlength="1" class="digit-box" id="digit3" onfocus="this.setAttribute('inputmode', 'numeric')" oninput="moveFocus(this, 3)" onkeypress="return isNumberKey(event)">
      <input type="password" maxlength="1" class="digit-box" id="digit4" onfocus="this.setAttribute('inputmode', 'numeric')" oninput="moveFocus(this, 4)" onkeypress="return isNumberKey(event)">
    </div>
    <div class="buttons">
      <button class="btn cancel" onclick="clearInput()">İptal</button>
      <button class="btn submit" onclick="verifyCode()">Gönder</button>
    </div>
    <div id="error" class="error"></div>
    <div class="info-text">(Ece'nin Okul Numarası)</div>
  </div>

  <div id="countdown" aria-live="polite"></div>
  <div id="message" role="alert" aria-live="assertive">
    🎉 Doğum günün kutlu olsun Ece! Nice yıllara! 🎂💖
  </div>

  <button id="play-music-btn" onclick="startMusicAndShowContent()">🎵 Müziği Başlat</button>

  <!-- Carousel -->
  <div class="carousel" aria-label="Doğum Günü Fotoğraf Slayt Gösterisi" id="carousel">
    <img src="https://i.imgur.com/rVT9UUO.png" alt="Ece'nin doğum günü resmi 1" class="carousel-slide" />
    <img src="https://i.imgur.com/7u6Fibw.png" alt="Ece'nin doğum günü resmi 2" class="carousel-slide" />
    <img src="https://i.imgur.com/BG1pwTv.png" alt="Ece'nin doğum günü resmi 3" class="carousel-slide" />
    <img src="https://i.imgur.com/W14BEzn.png" alt="Ece'nin doğum günü resmi 4" class="carousel-slide" />
    <img src="https://i.imgur.com/lDN54hn.png" alt="Ece'nin doğum günü resmi 5" class="carousel-slide" />
    <button class="carousel-button prev" aria-label="Önceki fotoğraf">&#10094;</button>
    <button class="carousel-button next" aria-label="Sonraki fotoğraf">&#10095;</button>
  </div>

  <!-- Müzik -->
  <audio id="music" preload="auto" loop>
    <source src="until_i_found_you.mp3" type="audio/mpeg" />
    Tarayıcınız ses çaları desteklemiyor.
  </audio>

  <!-- Konfeti için canvas -->
  <canvas id="confetti-canvas"></canvas>

<script>
  const boxes = Array.from(document.querySelectorAll('.digit-box'));

<div class="password-input">
  <input type="text" maxlength="1" class="password-box" />
  <input type="text" maxlength="1" class="password-box" />
  <input type="text" maxlength="1" class="password-box" />
  <input type="text" maxlength="1" class="password-box" />
</div>

<script>
const boxes = document.querySelectorAll('.password-box');

boxes.forEach((box, index) => {
  box.addEventListener('input', (event) => {
    moveFocus(event.target, index);
  });

  box.addEventListener('keydown', (event) => {
    handleKeydown(event, index);
  });
});

// Burada yukarıda paylaştığınız moveFocus() ve handleKeydown() fonksiyonlarını ekleyebilirsiniz
function moveFocus(currentBox, index) {
  if (currentBox.value.length === 1) {
    if (index < boxes.length - 1) {
      boxes[index + 1].focus();
    }
  } else if (currentBox.value.length === 0 && index > 0) {
    boxes[index - 1].focus();
  }
}

function handleKeydown(event, index) {
  const currentBox = boxes[index];
  if (event.key === 'Backspace' && currentBox.value.length === 0 && index > 0) {
    boxes[index - 1].focus();
    boxes[index - 1].value = '';
  } else if (event.key === 'ArrowLeft' && index > 0) {
    boxes[index - 1].focus();
  } else if (event.key === 'ArrowRight' && index < boxes.length - 1) {
    boxes[index + 1].focus();
  }
}

function getEnteredCode() {
  return boxes.map(b => b.value).join('');
}

function clearInput() {
  boxes.forEach(b => b.value = '');
  boxes[0].focus();
  document.getElementById('error').textContent = '';
}

function verifyCode() {
  const code = getEnteredCode();
  if (code === '1025') {
    alert('Şifre doğru! Giriş başarılı.');
    document.getElementById('password-section').style.display = 'none';
    document.getElementById('play-music-btn').style.display = 'block';
  } else {
    document.getElementById('error').textContent = 'Hatalı şifre, tekrar deneyin.';
  }
}

  function startMusicAndShowContent() {
    const music = document.getElementById('music');
    music.play().then(() => {
      document.getElementById('carousel').style.display = 'block';
      document.getElementById('play-music-btn').style.display = 'none'; // Butonu gizle
      showSlide(0);
      startSlideShow();
      updateCountdown();
      setInterval(updateCountdown, 1000);
    }).catch(err => {
      alert('Müziği başlatmak için etkileşim gerekiyor.');
      console.error(err);
    });
  }

  const countdownElement = document.getElementById('countdown');
  const messageElement = document.getElementById('message');
  const carousel = document.getElementById('carousel');
  const slides = carousel.querySelectorAll('.carousel-slide');
  const prevBtn = carousel.querySelector('.carousel-button.prev');
  const nextBtn = carousel.querySelector('.carousel-button.next');

  // Hedef tarih: 29 Mayıs 00:00 (bugün 29 Mayıs veya sonrası ise gelecek yıl)
  const hedefTarih = new Date();
  if (hedefTarih.getMonth() > 4 || (hedefTarih.getMonth() === 4 && hedefTarih.getDate() > 29)) {
    hedefTarih.setFullYear(hedefTarih.getFullYear() + 1);
  }
  hedefTarih.setMonth(4);
  hedefTarih.setDate(29);
  hedefTarih.setHours(0, 0, 0, 0);

  // Geri sayım fonksiyonu
  function updateCountdown() {
    const now = new Date();
    const fark = hedefTarih - now;

    if (fark <= 0) {
      countdownElement.style.display = "none";
      messageElement.style.display = "block";
      startConfetti();
      return;
    }

    const gun = Math.floor(fark / (1000 * 60 * 60 * 24));
    const saat = Math.floor((fark / (1000 * 60 * 60)) % 24);
    const dakika = Math.floor((fark / (1000 * 60)) % 60);
    const saniye = Math.floor((fark / 1000) % 60);

    countdownElement.textContent = 
      `📅 ${gun} gün, 🕒 ${saat} saat, ⏰ ${dakika} dakika, ⏳ ${saniye} saniye`;
    countdownElement.style.display = "block"; // Geri sayımı göster
  }

  let slideInterval;
  let currentIndex = 0;

  function showSlide(index) {
    slides.forEach((slide, i) => {
      slide.classList.toggle('active', i === index);
    });
    currentIndex = index;
  }

  function nextSlide() {
    let nextIndex = currentIndex + 1;
    if (nextIndex >= slides.length) nextIndex = 0;
    showSlide(nextIndex);
  }

  function prevSlide() {
    let prevIndex = currentIndex - 1;
    if (prevIndex < 0) prevIndex = slides.length - 1;
    showSlide(prevIndex);
  }

  prevBtn.addEventListener('click', () => {
    prevSlide();
    resetInterval();
  });

  nextBtn.addEventListener('click', () => {
    nextSlide();    resetInterval();
  });

  function startSlideShow() {
    slideInterval = setInterval(nextSlide, 5000);
  }

  function resetInterval() {
    clearInterval(slideInterval);
    startSlideShow();
  }

  // Konfeti animasyonu
  function startConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const confettiCount = 150;
    const confettis = [];

    class Confetti {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = (Math.random() * 7) + 3;
        this.speed = (Math.random() * 3) + 2;
        this.angle = Math.random() * 2 * Math.PI;
        this.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
        this.spin = (Math.random() - 0.5) * 0.1;
      }

      update() {
        this.y += this.speed;
        this.angle += this.spin;

        if (this.y > canvas.height) {
          this.y = -this.size;
          this.x = Math.random() * canvas.width;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    for(let i=0; i<confettiCount; i++) {
      confettis.push(new Confetti());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettis.forEach(c => {
        c.update();
        c.draw();
      });
      requestAnimationFrame(animate);
    }

    animate();
  }

  function isNumberKey(evt) {
    const charCode = (evt.which) ? evt.which : evt.keyCode;
    // Sadece 0-9 arası rakamları kontrol et
    return (charCode >= 48 && charCode <= 57) || charCode === 0;
  }
</script>
</body>
</html>
