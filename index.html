<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>🎉 Ece'nin Doğum Günü 🎉</title>
  <style>
    /* Genel stil */
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      position: relative;
      text-align: center;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
      z-index: 1000;
      position: relative;
      color: #ff1493;
      text-shadow: 0 0 8px #ff69b4;
    }

    #countdown {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 20px 40px;
      font-weight: 700;
      font-size: 2em;
      color: #ff007f;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
      margin-top: 10px;
      user-select: text;
      min-width: 350px;
      transition: opacity 0.5s ease;
      display: none;
    }

    #message {
      font-size: 2.2em;
      margin-top: 2em;
      color: #ff1493;
      text-shadow: 0 0 8px #ff69b4;
      display: none;
      position: relative;
      z-index: 1000;
    }

    /* Buton */
    #play-music-btn {
      padding: 15px 40px;
      font-size: 1.5em;
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff1493, #ff69b4);
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 20, 147, 0.7);
      transition: background 0.3s ease, transform 0.3s ease;
      user-select: none;
      margin-top: 20px;
      z-index: 1100;
    }
    #play-music-btn:hover {
      background: linear-gradient(45deg, #ff69b4, #ff1493);
      transform: scale(1.05);
    }
    #play-music-btn:active {
      transform: scale(0.95);
    }

    /* Quiz stil */
    #quiz-container {
      display: none; /* Başlangıçta gizli */
      margin-top: 20px;
      text-align: left;
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
    }

    .question {
      font-size: 1.2em;
      margin-bottom: 10px;
    }

    .option {
      margin: 5px 0;
    }

    .option input {
      margin-right: 10px;
    }

    /* Carousel container */
    .carousel {
      position: relative;
      margin: 40px auto 0;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      background: #fff;
      user-select: none;
      z-index: 1000;
      width: auto;
      height: auto;
      transition: width 0.8s ease, height 0.8s ease;
      display: inline-block;
      max-width: 90vw;
    }

    /* Slides */
    .carousel-slide {
      display: none;
      border-radius: 20px;
      max-width: 100%;
      height: auto;
      transition: opacity 0.7s ease-in-out;
      position: absolute;
      top: 0;
      left: 0;
      user-select: none;
      box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
    }

    .carousel-slide.active {
      display: block;
      position: relative;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    /* Navigation buttons */
    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      font-size: 2em;
      color: #ff007f;
      box-shadow: 0 0 15px rgba(255,0,127,0.7);
      transition: background 0.3s ease;
      user-select: none;
      z-index: 1100;
    }

    .carousel-button:hover {
      background: #ff007f;
      color: #fff;
      box-shadow: 0 0 20px #ff007f;
    }

    .carousel-button.prev {
      left: 15px;
    }

    .carousel-button.next {
      right: 15px;
    }

    /* Kalp animasyonları */
    .heart {
      position: fixed;
      width: 30px;
      height: 30px;
      background-color: #ff1493;
      transform: rotate(-45deg);
      pointer-events: none;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
      filter: drop-shadow(0 0 3px #ff69b4);
      z-index: 900;
      border-radius: 5px;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: #ff1493;
      border-radius: 50%;
    }
    .heart::before {
      top: -15px;
      left: 0;
    }
    .heart::after {
      left: 15px;
      top: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(-45deg); opacity: 0.8; }
      100% { transform: translateY(-400px) rotate(-45deg); opacity: 0; }
    }

    /* Canvas konfeti z-index */
    canvas#confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 950;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <h1>🎈 Ece'nin Doğum Gününe Geri Sayım 🎈</h1>

  <button id="play-music-btn" aria-label="Müziği Başlat">🎵 Müziği Başlat</button>

  <div id="countdown" aria-live="polite"></div>

  <div id="message" role="alert" aria-live="assertive">
    🎉 Doğum günün kutlu olsun Ece! Nice yıllara! 🎂💖
  </div>

  <!-- Carousel -->
  <div class="carousel" aria-label="Doğum Günü Fotoğraf Slayt Gösterisi" id="carousel" style="display:none;">
    <img src="https://i.imgur.com/rVT9UUO.png" alt="Ece'nin doğum günü resmi 1" class="carousel-slide" />
    <img src="https://i.imgur.com/7u6Fibw.png" alt="Ece'nin doğum günü resmi 2" class="carousel-slide" />
    <img src="https://i.imgur.com/BG1pwTv.png" alt="Ece'nin doğum günü resmi 3" class="carousel-slide" />
    <img src="https://i.imgur.com/W14BEzn.png" alt="Ece'nin doğum günü resmi 4" class="carousel-slide" />
    <img src="https://i.imgur.com/lDN54hn.png" alt="Ece'nin doğum günü resmi 5" class="carousel-slide" />
    <button class="carousel-button prev" aria-label="Önceki fotoğraf">&#10094;</button>
    <button class="carousel-button next" aria-label="Sonraki fotoğraf">&#10095;</button>
  </div>

  <!-- Quiz Container -->
  <div id="quiz-container">
    <h2>🎉 Ece'nin Quizine Hoş Geldiniz! 🎉</h2>
    <div id="questions"></div>
    <button id="submit-quiz-btn">Quiz'i Gönder</button>
    <div id="quiz-result" style="margin-top: 20px;"></div>
  </div>

  <!-- Müzik -->
  <audio id="music" preload="auto" loop>
    <source src="until_i_found_you.mp3" type="audio/mpeg" />
    Tarayıcınız ses çaları desteklemiyor.
  </audio>

  <!-- Konfeti için canvas -->
  <canvas id="confetti-canvas"></canvas>

<script>
  const countdownElement = document.getElementById('countdown');
  const messageElement = document.getElementById('message');
  const music = document.getElementById('music');
  const playBtn = document.getElementById('play-music-btn');
  const carousel = document.getElementById('carousel');
  const slides = carousel.querySelectorAll('.carousel-slide');
  const quizContainer = document.getElementById('quiz-container');
  const questionsDiv = document.getElementById('questions');
  const submitQuizBtn = document.getElementById('submit-quiz-btn');
  const quizResult = document.getElementById('quiz-result');

  // Hedef tarih: 29 Mayıs 00:00 (bugün 29 Mayıs veya sonrası ise gelecek yıl)
  const hedefTarih = new Date();
  if (hedefTarih.getMonth() > 4 || (hedefTarih.getMonth() === 4 && hedefTarih.getDate() > 29)) {
    hedefTarih.setFullYear(hedefTarih.getFullYear() + 1);
  }
  hedefTarih.setMonth(4);
  hedefTarih.setDate(29);
  hedefTarih.setHours(0, 0, 0, 0);

  // Geri sayım fonksiyonu
  function updateCountdown() {
    const now = new Date();
    const fark = hedefTarih - now;

    if (fark <= 0) {
      countdownElement.style.display = "none";
      messageElement.style.display = "block";
      startConfetti();
      return;
    }

    const gun = Math.floor(fark / (1000 * 60 * 60 * 24));
    const saat = Math.floor((fark / (1000 * 60 * 60)) % 24);
    const dakika = Math.floor((fark / (1000 * 60)) % 60);
    const saniye = Math.floor((fark / 1000) % 60);

    countdownElement.textContent = 
      `📅 ${gun} gün, 🕒 ${saat} saat, ⏰ ${dakika} dakika, ⏳ ${saniye} saniye`;
  }

  let slideInterval;
  let currentIndex = 0;

  function adjustCarouselSize(img) {
    const naturalWidth = img.naturalWidth;
    const naturalHeight = img.naturalHeight;
    carousel.style.width = naturalWidth + 'px';
    carousel.style.height = naturalHeight + 'px';
  }

  function showSlide(index) {
    slides.forEach((slide, i) => {
      slide.classList.toggle('active', i === index);
    });
    currentIndex = index;

    const activeImage = slides[currentIndex];
    if (!activeImage.complete) {
      activeImage.onload = () => {
        adjustCarouselSize(activeImage);
      };
    } else {
      adjustCarouselSize(activeImage);
    }
  }

  function nextSlide() {
    let nextIndex = currentIndex + 1;
    if (nextIndex >= slides.length) nextIndex = 0;
    showSlide(nextIndex);
  }

  function prevSlide() {
    let prevIndex = currentIndex - 1;
    if (prevIndex < 0) prevIndex = slides.length - 1;
    showSlide(prevIndex);
  }

  prevBtn.addEventListener('click', () => {
    prevSlide();
    resetInterval();
  });

  nextBtn.addEventListener('click', () => {
    nextSlide();
    resetInterval();
  });

  function startSlideShow() {
    slideInterval = setInterval(nextSlide, 5000);
  }

  function resetInterval() {
    clearInterval(slideInterval);
    startSlideShow();
  }

  // Kalp animasyonları
  function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.top = window.innerHeight + 30 + 'px';
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }
  setInterval(createHeart, 400);

  // Konfeti animasyonu
  function startConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const confettiCount = 150;
    const confettis = [];

    class Confetti {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = (Math.random() * 7) + 3;
        this.speed = (Math.random() * 3) + 2;
        this.angle = Math.random() * 2 * Math.PI;
        this.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
        this.spin = (Math.random() - 0.5) * 0.1;
      }

      update() {
        this.y += this.speed;
        this.angle += this.spin;

        if (this.y > canvas.height) {
          this.y = -this.size;
          this.x = Math.random() * canvas.width;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    for(let i=0; i<confettiCount; i++) {
      confettis.push(new Confetti());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettis.forEach(c => {
        c.update();
        c.draw();
      });
      requestAnimationFrame(animate);
    }

    animate();
  }

  // Müzik kontrolü
  playBtn.addEventListener('click', () => {
    music.play().then(() => {
      playBtn.style.display = 'none';
      countdownElement.style.display = 'block';
      carousel.style.display = 'inline-block';
      showSlide(0);
      startSlideShow();
      updateCountdown();
      setInterval(updateCountdown, 1000);
      quizContainer.style.display = 'block'; // Quiz'i göster
      loadQuiz(); // Quiz'i yükle
    }).catch(err => {
      alert('Müziği başlatmak için etkileşim gerekiyor.');
      console.error(err);
    });
  });

  // Quiz yükleme
  function loadQuiz() {
    const questions = [
      {
        question: "Ece şuanda karatede hangi kuşakta?",
        options: ["Kahverengi", "Siyah", "Mavi", "Yeşil"],
        answer: "Kahverengi"
      },
      {
        question: "Ece şuanda hangi okulda okuyor?",
        options: ["İzmir Fen Lisesi", "Bornova Anadolu Lisesi", "Menemen Atatürk Anadolu Lisesi", "ODTÜ"],
        answer: "Menemen Atatürk Anadolu Lisesi"
      },
      {
        question: "Ecenin en sevdiği hayvan?",
        options: ["Kedi", "Köpek", "Tavşan", "Kuş"],
        answer: "Kedi"
      },
      {
        question: "Ece şuan kaçıncı sınıf?",
        options: ["10", "11", "12", "9"],
        answer: "11"
      },
      {
        question: "Ecenin sınıf şubesi nedir?",
        options: ["11-B", "11-G", "11-H", "11-İ"],
        answer: "11-İ"
      },
      {
        question: "Ecenin okuduğu bölüm nedir?",
        options: ["Sayısal", "Dil", "Eşit Ağırlık", "Sözel"],
        answer: "Dil"
      },
      {
        question: "Ecenin okul numarası kaçtır?",
   options: ["1028", "1025", "1088", "1005"],
        answer: "1025"
      },
      {
        question: "Ecenin doğduğu yıl kaçtır?",
        options: ["2007", "2008", "2009", "2010"],
        answer: "2008"
      },
      {
        question: "Ece hangi ayda doğmuştur?",
        options: ["Nisan", "Mayıs", "Haziran", "Temmuz"],
        answer: "Mayıs"
      },
      {
        question: "Ecenin en sevdiği arkadaşının ismi nedir?",
        options: ["Tuna", "Tuna", "Tuna", "Tuna"],
        answer: "Tuna"
      }
    ];

    questions.forEach((q, index) => {
      const questionDiv = document.createElement('div');
      questionDiv.classList.add('question');
      questionDiv.innerHTML = `<p>${index + 1}. ${q.question}</p>`;

      q.options.forEach(option => {
        const optionDiv = document.createElement('div');
        optionDiv.classList.add('option');
        optionDiv.innerHTML = `<label><input type="radio" name="question${index}" value="${option}"> ${option}</label>`;
        questionDiv.appendChild(optionDiv);
      });

      questionsDiv.appendChild(questionDiv);
    });

    submitQuizBtn.addEventListener('click', submitQuiz);
  }

  function submitQuiz() {
    const questions = [
      {
        answer: "Kahverengi"
      },
      {
        answer: "Menemen Atatürk Anadolu Lisesi"
      },
      {
        answer: "Kedi"
      },
      {
        answer: "11"
      },
      {
        answer: "11-İ"
      },
      {
        answer: "Dil"
      },
      {
        answer: "1025"
      },
      {
        answer: "2008"
      },
      {
        answer: "Mayıs"
      },
      {
        answer: "Tuna"
      }
    ];

    let score = 0;

    questions.forEach((q, index) => {
      const selectedOption = document.querySelector(`input[name="question${index}"]:checked`);
      if (selectedOption && selectedOption.value === q.answer) {
        score++;
      }
    });

    quizResult.innerHTML = `Quiz tamamlandı! Puanınız: ${score} / ${questions.length}`;
  }

</script>
</body>
</html>
