<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anılar Galerisi</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; background: #222; color: #fff; display: flex; justify-content: center; align-items: center; 
      font-family: 'Poppins', sans-serif;
    }
    .slider {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
      height: 100%;
    }
    .slide {
      min-width: 100vw;
      height: 100vh;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      flex-shrink: 0;
    }
    /* İstersen navigasyon okları vs ekleyebilirim */
  </style>
</head>
<body>

  <div class="slider">
    <div class="slides" id="slides">
      <div class="slide" style="background-image: url('https://i.imgur.com/w38ApFX.jpeg');"></div>
      <div class="slide" style="background-image: url('https://i.imgur.com/ahJTXWO.jpeg');"></div>
      <div class="slide" style="background-image: url('https://i.imgur.com/8MvwSQp.jpeg');"></div>
      <div class="slide" style="background-image: url('https://i.imgur.com/x39dCoM.jpeg');"></div>
      <div class="slide" style="background-image: url('https://i.imgur.com/DUhcnSQ.jpeg');"></div>
      <div class="slide" style="background-image: url('https://i.imgur.com/lcQuFtH.jpeg');"></div>
    </div>
  </div>

  <script>
    // Giriş kontrolü
    window.addEventListener('load', () => {
      const isLoggedIn = localStorage.getItem('isLoggedIn');
      if (isLoggedIn !== 'true') {
        window.location.href = '../index.html'; // index.html konumuna göre düzenle
      }
    });

    // Basit slider animasyonu
    const slides = document.getElementById('slides');
    const totalSlides = slides.children.length;
    let index = 0;

    function showNextSlide() {
      index = (index + 1) % totalSlides;
      slides.style.transform = `translateX(-${index * 100}vw)`;
    }

    setInterval(showNextSlide, 3500); // Her 3.5 saniyede bir kaydır
  </script>

</body>
</html>
