<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Fotoğraf Slider</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    margin: 0; padding: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  .slider-container {
    position: relative;
    width: 90vw;
    max-width: 600px;
    height: 400px;
    overflow: hidden;
    border-radius: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.8);
    background: #111;
  }
  .slides {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.5s ease-in-out;
  }
  .slides img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
  }
  /* Butonlar */
  .btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(124, 58, 237, 0.7);
    border: none;
    color: white;
    padding: 10px 16px;
    cursor: pointer;
    border-radius: 50%;
    font-size: 20px;
    transition: background 0.3s ease;
    user-select: none;
  }
  .btn:hover {
    background: #7c3aed;
  }
  .btn-prev {
    left: 10px;
  }
  .btn-next {
    right: 10px;
  }
  /* Dots */
  .dots {
    position: absolute;
    bottom: 12px;
    width: 100%;
    text-align: center;
  }
  .dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin: 0 5px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  .dot.active {
    background: #7c3aed;
  }
  /* Responsive */
  @media (max-width: 480px) {
    .slider-container {
      height: 250px;
    }
  }
</style>
</head>
<body>

<div class="slider-container">
  <div class="slides" id="slides">
    <img src="https://i.imgur.com/w38ApFX.jpeg" alt="Fotoğraf 1" />
    <img src="https://i.imgur.com/ahJTXWO.jpeg" alt="Fotoğraf 2" />
    <img src="https://i.imgur.com/8MvwSQp.jpeg" alt="Fotoğraf 3" />
    <img src="https://i.imgur.com/x39dCoM.jpeg" alt="Fotoğraf 4" />
    <img src="https://i.imgur.com/DUhcnSQ.jpeg" alt="Fotoğraf 5" />
    <img src="https://i.imgur.com/lcQuFtH.jpeg" alt="Özel Fotoğraf" />
  </div>

  <button class="btn btn-prev" id="prevBtn">&#10094;</button>
  <button class="btn btn-next" id="nextBtn">&#10095;</button>

  <div class="dots" id="dots"></div>
</div>

<script>
  const slides = document.getElementById('slides');
  const images = slides.querySelectorAll('img');
  const dotsContainer = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let currentIndex = 0;
  const total = images.length;

  // Create dots
  for(let i=0; i < total; i++) {
    const dot = document.createElement('span');
    dot.classList.add('dot');
    if(i === 0) dot.classList.add('active');
    dot.dataset.index = i;
    dotsContainer.appendChild(dot);
  }

  const dots = dotsContainer.querySelectorAll('.dot');

  function updateSlider() {
    slides.style.transform = `translateX(${-currentIndex * 100}%)`;
    dots.forEach(dot => dot.classList.remove('active'));
    dots[currentIndex].classList.add('active');
  }

  function nextSlide() {
    currentIndex = (currentIndex + 1) % total;
    updateSlider();
  }

  function prevSlide() {
    currentIndex = (currentIndex - 1 + total) % total;
    updateSlider();
  }

  // Dots click
  dots.forEach(dot => {
    dot.addEventListener('click', () => {
      currentIndex = parseInt(dot.dataset.index);
      updateSlider();
      resetInterval();
    });
  });

  prevBtn.addEventListener('click', () => {
    prevSlide();
    resetInterval();
  });
  nextBtn.addEventListener('click', () => {
    nextSlide();
    resetInterval();
  });

  // Otomatik kaydırma
  let slideInterval = setInterval(nextSlide, 3000);

  function resetInterval() {
    clearInterval(slideInterval);
    slideInterval = setInterval(nextSlide, 3000);
  }
</script>

</body>
</html>
